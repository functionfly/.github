<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="globe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Globe outline -->
  <circle cx="200" cy="315" r="140" fill="none" stroke="url(#globe)" stroke-width="4" opacity="0.3"/>
  <circle cx="200" cy="315" r="100" fill="none" stroke="url(#globe)" stroke-width="3" opacity="0.2"/>
  <circle cx="200" cy="315" r="60" fill="none" stroke="url(#globe)" stroke-width="2" opacity="0.15"/>
  <!-- City dots -->
  <circle cx="150" cy="280" r="8" fill="#f59e0b"/>
  <circle cx="220" cy="310" r="6" fill="#f59e0b"/>
  <circle cx="180" cy="350" r="5" fill="#f59e0b"/>
  <circle cx="240" cy="290" r="4" fill="#fbbf24"/>
  <circle cx="160" cy="330" r="4" fill="#fbbf24"/>
  <circle cx="200" cy="270" r="3" fill="#fcd34d"/>
  <circle cx="250" cy="340" r="3" fill="#fcd34d"/>
  <!-- Logo mark -->
  <rect x="80" y="80" width="72" height="72" rx="14" fill="#0F172A"/>
  <path d="M116 97L157 138L116 179L75 138L116 97Z" fill="#6366F1"/>
  <path d="M116 114.5L135.5 134L116 153.5L96.5 134L116 114.5Z" fill="white"/>
  <path d="M116 124L125.5 134L116 144L106.5 134L116 124Z" fill="#6366F1"/>
  <!-- Wordmark -->
  <text x="180" y="135" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="48" font-weight="700">FunctionFly</text>
  <!-- Title -->
  <text x="80" y="520" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="64" font-weight="700">City Rankings</text>
  <!-- Tagline -->
  <text x="80" y="580" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="28">Live Map of Human + AI Productivity</text>
  <!-- Rank badges -->
  <rect x="900" y="200" width="200" height="80" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="1000" y="245" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="36" font-weight="700" text-anchor="middle">#1</text>
  <text x="1000" y="270" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">AUSTIN, TX</text>
  <rect x="900" y="300" width="200" height="80" rx="12" fill="#1e293b" stroke="#6366F1" stroke-width="2"/>
  <text x="1000" y="345" fill="#6366F1" font-family="system-ui,sans-serif" font-size="36" font-weight="700" text-anchor="middle">#2</text>
  <text x="1000" y="370" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">SAN FRANCISCO</text>
  <rect x="900" y="400" width="200" height="80" rx="12" fill="#1e293b" stroke="#6366F1" stroke-width="1"/>
  <text x="1000" y="445" fill="#818cf8" font-family="system-ui,sans-serif" font-size="36" font-weight="700" text-anchor="middle">#3</text>
  <text x="1000" y="470" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">NEW YORK</text>
