<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
    <!-- Symbol Gradient (3-tone) -->
    <linearGradient id="symbolGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#e879f9"/>
    </linearGradient>
    <!-- Lightning Gradient -->
    <linearGradient id="lightningGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Symbol Group (48x48) -->
  <g transform="translate(0, 0)">
    <!-- Hexagon Base -->
    <path d="M24 4 L42 14 L42 34 L24 44 L6 34 L6 14 Z" 
          fill="url(#symbolGradient)" 
          opacity="0.15"/>
    <path d="M24 4 L42 14 L42 34 L24 44 L6 34 L6 14 Z" 
          fill="none" 
          stroke="url(#symbolGradient)" 
          stroke-width="2"/>
    
    <!-- Wing Tips -->
    <path d="M24 8 L32 14 L24 14 L16 14 Z" 
          fill="url(#symbolGradient)" 
          opacity="0.8"/>
    <path d="M12 26 L18 30 L15 34 L10 30 Z" 
          fill="url(#symbolGradient)" 
          opacity="0.6"/>
    <path d="M36 26 L30 30 L33 34 L38 30 Z" 
          fill="url(#symbolGradient)" 
          opacity="0.6"/>
    
    <!-- Lightning Bolt Core -->
    <path d="M26 12 L20 22 L24 22 L22 32 L30 20 L26 20 L28 12 Z" 
          fill="url(#lightningGradient)"/>
    
    <!-- Flight Path Lines -->
    <path d="M24 16 L24 36" 
          stroke="url(#symbolGradient)" 
          stroke-width="2" 
          stroke-linecap="round"/>
    <path d="M18 20 L24 24 L30 20" 
          fill="none" 
          stroke="url(#symbolGradient)" 
          stroke-width="1.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Connection Dots (representing cloud nodes) -->
    <circle cx="24" cy="18" r="2" fill="#6366f1"/>
    <circle cx="18" cy="28" r="1.5" fill="#8b5cf6"/>
    <circle cx="30" cy="28" r="1.5" fill="#d946ef"/>
  </g>
  
  <!-- Wordmark: FunctionFly -->
  <text x="60" y="31" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="22" 
        font-weight="700" 
        letter-spacing="-0.02em"
        fill="#6366f1">
    FunctionFly
  </text>
</svg>
