<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FunctionFly Dashboard</title>
    <!-- Blocking theme script: must run before any CSS or paint to prevent dark/light flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme-storage');
          var theme = 'dark'; // default
          if (stored) {
            var parsed = JSON.parse(stored);
            var t = parsed && parsed.state && parsed.state.theme;
            if (t === 'light') {
              theme = 'light';
            } else if (t === 'dark') {
              theme = 'dark';
            } else if (t === 'system' || !t) {
              theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <!-- 2026 Font Stack - Velocity Brand -->
    <!-- Instrument Sans: Primary sans (Google Fonts) -->
    <!-- Ranade: Display/hero headlines (cdnfonts.com - 2025 breakout, technical+warm) -->
    <!-- Commit Mono: UI-optimized monospace (jsDelivr CDN) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/nickolay8857/CommitMono@main/CommitMono.css">
    <link rel="stylesheet" href="https://cdnfonts.com/ranade.font">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
