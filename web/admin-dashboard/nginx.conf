# ---------------------------------------------------------------------------
# nginx config for the Admin Dashboard SPA.
#
# Hardening notes:
#  * HSTS is set for 2 years with includeSubDomains and preload so
#    submission to https://hstspreload.org is a config change, not a code
#    change.
#  * The CSP mirrors web/admin-dashboard/index.html so a static deploy and
#    a docker deploy are equivalent.
#  * COOP/COEP/CORP are set to "same-origin" / "require-corp" only when
#    the response is same-origin. Cross-origin API responses (when this
#    nginx is behind a CDN) keep the browser default.
#  * Cache-Control is intentionally `no-store` for index.html so deploys
#    take effect immediately. Hashed assets (under /assets/*) get a
#    long-lived immutable cache.
# ---------------------------------------------------------------------------

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Don't advertise the server software.
    server_tokens off;

    root /usr/share/nginx/html;

    # ---- Security headers (always sent) --------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://www.googletagmanager.com https://cdn.mxpnl.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://www.google-analytics.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.functionfly.com http://localhost:8080 http://127.0.0.1:8080 ws: wss: https://www.google-analytics.com https://www.googletagmanager.com https://api.mixpanel.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.functionfly.com https://api.staging.functionfly.com; object-src 'none'; frame-src 'none'; upgrade-insecure-requests;" always;

    # ---- MIME / sniff protection ---------------------------------------
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff                             woff;
        font/woff2                            woff2;
        application/wasm                      wasm;
    }
    default_type application/octet-stream;

    # ---- Gzip / compression ---------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---- Health check (no auth, no log) ---------------------------------
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # ---- Hashed asset bundles: cache forever -----------------------------
    # Vite emits `dist/assets/<hash>-<name>.<ext>`. Cache them immutably
    # so deploys are picked up via the hashed filename.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- Long-lived static (favicon, robots, etc.) ----------------------
    location ~* \.(?:ico|png|jpg|jpeg|svg|webp|woff2?|ttf|eot|otf)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ---- SPA fallback ---------------------------------------------------
    # index.html must never be cached so a new deploy is picked up.
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location / {
        # Default: no cache for HTML routes.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # ---- Block hidden files / VCS metadata ------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---- Block editor / temp files --------------------------------------
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---- Block known non-app paths so a misconfigured SPA route never
    # ---- serves a server-side resource by accident.
    location ~ ^/\.(git|svn|hg|env|idea|vscode) {
        deny all;
        return 404;
    }

    # Custom 404 → SPA (so React Router can render "not found").
    error_page 404 /index.html;
}
