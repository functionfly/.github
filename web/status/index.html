<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FunctionFly System Status - Real-time platform health and incident monitoring. Track uptime, view incidents, and subscribe to status updates."
    />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph -->
    <meta property="og:title" content="FunctionFly Status" />
    <meta
      property="og:description"
      content="Real-time platform health and incident monitoring"
    />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FunctionFly Status" />
    <meta
      name="twitter:description"
      content="Real-time platform health and incident monitoring"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>FunctionFly Status</title>

    <style>
      /* Critical CSS for initial render */
      html {
        background-color: #0a0a0f;
      }
      body {
        margin: 0;
        background-color: #0a0a0f;
        color: #ffffff;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      /* Loading state */
      .loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        z-index: 9999;
      }
      .loading-spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #6366f1;
        border-right-color: #8b5cf6;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Fallback loading screen while JS loads -->
      <div class="loading-screen">
        <div class="loading-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
