# Grafana Cloud Metrics Forwarder for FunctionFly
# Lightweight Prometheus that forwards metrics to Grafana Cloud

app = "functionfly-grafana-cloud"
primary_region = "iad"

[build]
  dockerfile = "deploy/monitoring/Dockerfile.grafana-cloud"

[env]
  # Storage settings - minimal since metrics are forwarded to Grafana Cloud
  PROMETHEUS_STORAGE_PATH = "/prometheus/data"
  PROMETHEUS_RETENTION_TIME = "2d"
  PROMETHEUS_RETENTION_SIZE = "500MB"

# Prometheus UI for debugging (optional)
[http_service]
  internal_port = 9090
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/-/healthy"
    protocol = "http"

# Minimal VM - just forwarding metrics
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Small ephemeral volume for buffering during network issues
[[mounts]]
  source = "grafana_cloud_buffer"
  destination = "/prometheus/data"
  initial_size = "1gb"

[deploy]
  strategy = "rolling"
  max_unavailable = 1
  wait_timeout = "2m0s"
