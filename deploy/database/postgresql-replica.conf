# Production PostgreSQL Replica Configuration for FunctionFly
# This file contains read replica optimized PostgreSQL settings

# Replication Settings
hot_standby = on
primary_conninfo = 'host=postgres port=5432 user=functionfly_prod password=${DB_PASSWORD} dbname=functionfly_prod'

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 100  # Lower than primary since it's read-only

# Memory Settings (optimized for read workloads)
shared_buffers = 512MB  # Higher than primary for read caching
effective_cache_size = 2GB
work_mem = 8MB  # Higher for complex queries
maintenance_work_mem = 128MB

# WAL Settings
wal_level = replica
max_wal_senders = 0  # Replica doesn't send WAL
wal_keep_size = 0  # Not needed on replica
hot_standby_feedback = on  # Send feedback to prevent vacuum issues

# Checkpoint Settings
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# Query Planning (optimized for reads)
default_statistics_target = 200  # Higher for better query plans
random_page_cost = 1.0  # SSD optimized

# Logging (less verbose than primary)
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'ddl'
log_duration = on
log_min_duration_statement = 5000  # Only log slow queries > 5 seconds
log_checkpoints = off
log_connections = off
log_disconnections = off
log_lock_waits = on

# Performance Monitoring
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = off

# Autovacuum Settings (important for replicas)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 10s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.02
autovacuum_analyze_scale_factor = 0.01

# Replica-specific settings
max_standby_archive_delay = 300s
max_standby_streaming_delay = 300s
wal_receiver_timeout = 60s