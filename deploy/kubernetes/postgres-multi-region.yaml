      app: postgres
      role: replica
      region: ap-southeast-1
  template:
    metadata:
      labels:
        app: postgres
        role: replica
        region: ap-southeast-1
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - ap-southeast-1
                      - asia-southeast1
                      - ap-northeast-1
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              value: functionfly
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: REPLICA_MODE
              value: "streaming"
            - name: PRIMARY_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-replica-config
                  key: DB_PRIMARY_HOST
            - name: PRIMARY_PORT
              value: "5432"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: replica-config
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: replica-config
          configMap:
            name: postgres-replica-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica-apac
  namespace: functionfly
  labels:
    app: postgres
    role: replica
    region: ap-southeast-1
spec:
  selector:
    app: postgres
    role: replica
    region: ap-southeast-1
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP
---
# ConfigMap for replica initialization script
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-replica-init
  namespace: functionfly
data:
  init-replica.sh: |
    #!/bin/bash
    set -e

    if [ "$REPLICA_MODE" = "streaming" ]; then
      echo "Configuring PostgreSQL as streaming replica..."

      # Wait for primary to be available
      until pg_isready -h "$PRIMARY_HOST" -p "$PRIMARY_PORT" -U postgres; do
        echo "Waiting for primary at $PRIMARY_HOST:$PRIMARY_PORT..."
        sleep 2
      done

      # Stop PostgreSQL to configure replication
      pg_ctl stop -D "$PGDATA" -m fast || true

      # Clear data directory if not already a replica
      if [ ! -f "$PGDATA/standby.signal" ]; then
        rm -rf "$PGDATA"/*

        # Base backup from primary
        echo "Taking base backup from primary..."
        PGPASSWORD="$POSTGRES_PASSWORD" pg_basebackup \
          -h "$PRIMARY_HOST" \
          -p "$PRIMARY_PORT" \
          -U "$POSTGRES_USER" \
          -D "$PGDATA" \
          -Fp \
          -Xs \
          -P \
          -v \
          -R \
          -C \
          -S "replica_$(hostname)" || {
            echo "Base backup failed, starting without replication..."
            exit 0
          }
      fi

      # Ensure standby signal exists
      touch "$PGDATA/standby.signal"

      # Update postgresql.auto.conf for streaming replication
      cat >> "$PGDATA/postgresql.auto.conf" << EOF
    primary_conninfo = 'host=$PRIMARY_HOST port=$PRIMARY_PORT user=$POSTGRES_USER password=$POSTGRES_PASSWORD application_name=$(hostname)'
    restore_command = 'cp /var/lib/postgresql/wal/%f %p'
    recovery_target_timeline = 'latest'
    hot_standby = on
    max_standby_archive_delay = 30s
    max_standby_streaming_delay = 30s
    wal_receiver_status_interval = 10s
    hot_standby_feedback = on
    EOF

      echo "Replica configuration complete"
    fi
