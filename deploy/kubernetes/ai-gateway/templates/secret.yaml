{{- /*
AI Gateway Secret Template

NOTE: Sensitive data should be managed via external secrets operators
(e.g., AWS Secrets Manager, HashiCorp Vault, External Secrets Operator).
This template provides a placeholder for development only.

In production, use ExternalSecrets operator to sync secrets from:
- AWS Secrets Manager
- HashiCorp Vault
- GCP Secret Manager
- Azure Key Vault
*/ -}}
{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "ai-gateway.name" . }}
    chart: {{ include "ai-gateway.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- include "ai-gateway.labels" . | nindent 4 }}
type: Opaque
{{- /*
NOTE: In production, leave data empty and use ExternalSecrets operator
to populate from external secret stores.
*/ -}}
{{- if .Values.secret.data }}
data:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- else }}
# In production, use ExternalSecrets operator instead:
# https://external-secrets.io/
# data:
#   RUNPOD_API_KEY: {{ "{{" }} .Values.RUNPOD_API_KEY {{ "}}" }}
{{- end }}
{{- end }}
