apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orchestrator-api-network-policy
  namespace: functionfly
  labels:
    app: orchestrator-api
  annotations:
    description: "Network policy for orchestrator-api pods. Controls ingress and egress traffic."
spec:
  podSelector:
    matchLabels:
      app: orchestrator-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow health checks from kubelet (for liveness/readiness probes)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kubelet
      ports:
        - protocol: TCP
          port: 8080
    # Allow Prometheus scraping from monitoring namespace (if exists)
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8080
    # Allow traffic from ingress controller (Caddy/Nginx)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/ingress.class: traefik
      ports:
        - protocol: TCP
          port: 8080
    # Allow traffic from ingress-nginx (common ingress controller)
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Allow traffic from other functionfly namespace pods (internal communication)
    - from:
        - podSelector:
            matchLabels:
              app: orchestrator-api
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow egress to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow egress to Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow egress to NATS (if used for SAR runtime)
    - to:
        - podSelector:
            matchLabels:
              app: nats
      ports:
        - protocol: TCP
          port: 4222
    # Allow HTTPS egress to external services (AI providers, email, etc.)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16  # AWS metadata
              - 10.0.0.0/8       # Private ranges
              - 172.16.0.0/12    # Private ranges
              - 192.168.0.0/16   # Private ranges
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: functionfly
  labels:
    app: postgres
  annotations:
    description: "Network policy for PostgreSQL. Only allows ingress from functionfly namespace."
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from orchestrator-api
    - from:
        - podSelector:
            matchLabels:
              app: orchestrator-api
      ports:
        - protocol: TCP
          port: 5432
    # Allow from other postgres pods (for replication)
    - from:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-network-policy
  namespace: functionfly
  labels:
    app: redis
  annotations:
    description: "Network policy for Redis. Only allows ingress from functionfly namespace."
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from orchestrator-api
    - from:
        - podSelector:
            matchLabels:
              app: orchestrator-api
      ports:
        - protocol: TCP
          port: 6379
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: functionfly
  annotations:
    description: "Default deny-all policy. Blocks all traffic by default, must be explicitly allowed."
spec:
  # This empty podSelector matches all pods in the namespace
  # Comment out or remove this if you want to allow all traffic by default
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
