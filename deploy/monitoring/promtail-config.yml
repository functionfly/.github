server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: functionfly-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: functionfly
          __path__: /var/log/functionfly/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            request_id: request_id
      - labels:
          level:
          service:
          request_id:
      - timestamp:
          source: timestamp
          format: RFC3339
      - output:
          source: message

  - job_name: docker-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            time: time
      - json:
          expressions:
            message: message
            level: level
            service: service
          source: log
      - labels:
          level:
          service:
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: message