global:
  smtp_smarthost: "${SMTP_HOST}:${SMTP_PORT}"
  smtp_from: "${SMTP_FROM_EMAIL}"
  smtp_require_tls: true
  smtp_auth_username: "${SMTP_USERNAME}"
  smtp_auth_password: "${SMTP_PASSWORD}"

route:
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "security-team"
  routes:
    - match:
        severity: critical
      receiver: "security-team"
    - match:
        category: security
      receiver: "security-team"
    - match:
        category: compliance
      receiver: "compliance-team"

receivers:
  - name: "security-team"
    email_configs:
      - to: "security@functionfly.dev"
        subject: "[CRITICAL] FunctionFly Security Alert: {{ .GroupLabels.alertname }}"
        body: |
          {{ range .Alerts }}
          [CRITICAL] {{ .Annotations.summary }}

          {{ .Annotations.description }}

          Labels:
          {{ range .Labels.SortedPairs }}{{ .Name }}: {{ .Value }}
          {{ end }}

          {{ end }}

  - name: "compliance-team"
    email_configs:
      - to: "compliance@functionfly.dev"
        subject: "[INFO] FunctionFly Compliance Alert: {{ .GroupLabels.alertname }}"
        body: |
          {{ range .Alerts }}
          [INFO] {{ .Annotations.summary }}

          {{ .Annotations.description }}

          Labels:
          {{ range .Labels.SortedPairs }}{{ .Name }}: {{ .Value }}
          {{ end }}

          {{ end }}

  - name: "default"
    email_configs:
      - to: "ops@functionfly.dev"
        subject: "[WARNING] FunctionFly Alert: {{ .GroupLabels.alertname }}"
