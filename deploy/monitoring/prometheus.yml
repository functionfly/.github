global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Job names must match status handler: orchestrator-api, health-monitor, postgres, redis
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Orchestrator API: host when make dev; orchestrator-api:8080 when full stack in Docker
  - job_name: 'orchestrator-api'
    static_configs:
      - targets: ['orchestrator-api:8080', 'host.docker.internal:8080']
    scrape_interval: 10s
    metrics_path: /metrics

  # Health monitor: only in Docker (no host process)
  - job_name: 'health-monitor'
    static_configs:
      - targets: ['health-monitor:8080']
    scrape_interval: 30s
    metrics_path: /metrics

  # Optional: when postgres-exporter / redis-exporter are running (e.g. docker-compose.monitoring)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s
