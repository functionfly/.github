# FunctionFly Production Prometheus Configuration
# For production deployments - no development targets
#
# Environment variables:
#   PROMETHEUS_SCRAPE_INTERVAL - How often to scrape targets (default: 15s)
#   PROMETHEUS_EVALUATION_INTERVAL - How often to evaluate rules (default: 15s)
#   DATADOG_API_KEY - Datadog API key for remote_write (optional)
#   DATADOG_SITE - Datadog site (default: datadoghq.com)

global:
  scrape_interval: ${PROMETHEUS_SCRAPE_INTERVAL:-15s}
  evaluation_interval: ${PROMETHEUS_EVALUATION_INTERVAL:-15s}

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Orchestrator API - production targets only
  - job_name: "orchestrator-api"
    static_configs:
      - targets: ["orchestrator-api:8080"]
    scrape_interval: 10s
    metrics_path: /metrics

  # Health monitor
  - job_name: "health-monitor"
    static_configs:
      - targets: ["health-monitor:8080"]
    scrape_interval: 30s
    metrics_path: /metrics

  # PostgreSQL exporter (when running)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 30s

  # Redis exporter (when running)
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 30s

# Remote write configuration for Datadog (optional)
# Enable by setting DATADOG_API_KEY
remote_write:
  - url: "https://api.${DATADOG_SITE:-datadoghq.com}/api/v1/series"
    bearer_token_file: /etc/secrets/datadog_api_key
    queue_config:
      capacity: 10000
      max_shards: 5
      min_shards: 1
      batch_send_deadline: 5s
