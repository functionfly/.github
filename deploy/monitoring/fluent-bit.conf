[SERVICE]
    Flush         5
    Log_Level     info
    Daemon        off

[INPUT]
    Name              tail
    Path              /var/log/functionfly/*.log
    Parser            json
    Tag               functionfly.*
    Refresh_Interval  5

[INPUT]
    Name              tail
    Path              /var/log/functionfly/*.log
    Exclude_Path      *.gz
    Parser            json
    Tag               functionfly.archived.*
    Refresh_Interval  5

[FILTER]
    Name                record_modifier
    Match               functionfly.*
    Record              service functionfly
    Record              environment ${ENVIRONMENT:production}

[FILTER]
    Name                grep
    Match               functionfly.*
    Regex               level (error|warn|info)

[OUTPUT]
    Name  es
    Match functionfly.*
    Host  elasticsearch
    Port  9200
    Index functionfly-logs
    Type  _doc

[OUTPUT]
    Name  stdout
    Match functionfly.*
    Format json_lines