[project]
name = "ai-gateway"
version = "0.1.0"
description = "AI Gateway - FastAPI service for AI inference routing"
authors = [{name = "FunctionFly", email = "dev@functionfly.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.135.2",
    "uvicorn[standard]>=0.42.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.22",
]

# Optional dependencies
onnx = ["onnxruntime>=1.17.0"]
gpu = ["onnxruntime-gpu>=1.17.0", "torch>=2.1.0", "cuda-python>=12.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "types-python-multipart>=0.1.0",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.24.4"]
gpu = ["onnxruntime-gpu>=1.24.4", "torch>=2.1.0"]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.15.8",
    "mypy>=1.19.1",
    "types-python-multipart>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
