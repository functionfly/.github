          description: Key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/state/{key}:
    get:
      tags:
        - State
      summary: Get state value
      description: Returns the current value for a state key.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: State key (dot-separated, e.g. `user.123.preferences.theme`)
      responses:
        '200':
          description: State value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateValue'
        '404':
          description: Key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - State
      summary: Set state value
      description: Sets a value for a state key with optional TTL.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateValueCreate'
      responses:
        '200':
          description: State value set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateValue'
        '400':
          description: Invalid value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/state/{key}/history:
    get:
      tags:
        - State
      summary: Get state history
      description: Returns the change history for a state key.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: State history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StateHistoryEntry'

  /v1/monitoring/metrics:
    get:
      tags:
        - Monitoring
      summary: Get metrics
      description: Returns Prometheus-formatted metrics for the platform.
      security: []
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  /v1/monitoring/status:
    get:
      tags:
        - Monitoring
      summary: Get system status
      description: Returns the current operational status of all platform components.
      security: []
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '503':
          description: Some components are unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'

  /v1/admin/retention/cleanup:
    post:
      tags:
        - Admin
      summary: Trigger cleanup
      description: Triggers an on-demand execution log cleanup (admin only).
      responses:
        '202':
          description: Cleanup started
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/admin/alerts:
    get:
      tags:
        - Admin
      summary: List all alerts
      description: Returns all active alerts across the platform (admin only).
      responses:
        '200':
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/admin/security-events:
    get:
      tags:
        - Admin
      summary: List security events
      description: Returns paginated security events (admin only).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of security events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSecurityEvents'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/frg/graph:
    get:
      tags:
        - FRG
      summary: Get Function Runtime Graph
      description: Returns the live runtime dependency graph for a function or app.
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [function, app]
          description: Graph scope
        - name: id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Runtime graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeGraph'
        '404':
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/frg/execute:
    post:
      tags:
        - FRG
      summary: Execute with graph
      description: Executes a function within the context of its runtime dependency graph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                function_id:
                  type: string
                  format: uuid
                input:
                  type: object
                graph_scope:
                  type: string
                  enum: [full, partial]
                  default: full
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'

  /v1/frg/webhook:
    post:
      tags:
        - FRG
      summary: Register FRG webhook
      description: Registers a webhook callback for FRG execution events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FRGWebhookRequest'
      responses:
        '201':
          description: Webhook registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FRGWebhook'

  /v1/privacy/export:
    post:
      tags:
        - Privacy
      summary: Request data export
      description: Requests a GDPR data export for the authenticated user.
      responses:
        '202':
          description: Export requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  export_id:
                    type: string
                    format: uuid
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/privacy/delete:
    delete:
      tags:
        - Privacy
      summary: Request account deletion
      description: Requests GDPR account deletion. All personal data is purged after the retention period.
      responses:
        '202':
          description: Deletion requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletion_id:
                    type: string
                    format: uuid
                  scheduled_at:
                    type: string
                    format: date-time
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/notifications:
    get:
      tags:
        - Notifications
      summary: List notifications
      description: Returns the authenticated user's notifications.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotifications'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    ws:
      get:
        tags:
          - Notifications
        summary: WebSocket for real-time notifications
        description: |
          Establishes a WebSocket connection for real-time push notifications.
          Use the `Authorization` header with the Bearer token to authenticate.
        responses:
          '101':
            description: WebSocket upgrade successful
          '401':
            description: Authentication failed
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

  /v1/apikeys:
    get:
      tags:
        - API Keys
      summary: List API keys
      description: Returns all API keys for the authenticated user.
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAPIKey'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - API Keys
      summary: Create API key
      description: Creates a new API key for programmatic access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyUserRequest'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAPIKeyCreated'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/apikeys/{key_id}:
    delete:
      tags:
        - API Keys
      summary: Revoke API key
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: API key revoked
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /metrics:
    get:
      tags:
        - Monitoring
      summary: Prometheus metrics
      description: Returns Prometheus-compatible metrics endpoint.
      security: []
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  # Agent Runtime Platform - Function Discovery
  /v1/agent/functions:
    get:
      tags:
        - AgentRuntime
      summary: List agent functions
      description: Returns all agent functions with optional filtering by category, exclusive, verified, or capabilities.
      security: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [search, browser, file, data, compute, communication, workflow, memory, assure, validate, simulate, observe, learn, agent_mgmt, capability]
        - name: exclusive
          in: query
          schema:
            type: boolean
        - name: verified
          in: query
          schema:
            type: boolean
        - name: capabilities
          in: query
          description: JSON array of required capabilities
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of agent functions
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  functions:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentFunction'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/agent/functions/{author}/{name}:
    get:
      tags:
        - AgentRuntime
      summary: Get agent function
      description: Returns a specific agent function by author and name.
      security: []
      parameters:
        - name: author
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent function details
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  author:
                    type: string
                  name:
                    type: string
        '404':
          description: Function not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Agent Runtime Platform - Function Execution
  /v1/agent/execute/{author}/{name}:
    post:
      tags:
        - AgentRuntime
      summary: Execute agent function
      description: Executes an agent function with the provided input.
      security:
        - BearerAuth: []
      parameters:
        - name: author
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
                  description: Function input parameters
                session_id:
                  type: string
                  description: Optional session ID for tracking
                call_depth:
                  type: integer
                  description: Recursion depth for nested calls
                trace_id:
                  type: string
                  description: Trace ID for distributed tracing
                span_id:
                  type: string
                  description: Span ID for distributed tracing
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  output:
                    type: object
                  execution_id:
                    type: string
                  duration_ms:
                    type: integer
                  cost_usd:
                    type: number
                  metadata:
                    type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Function not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/agent/execute/{author}/{name}/{version}:
    post:
      tags:
        - AgentRuntime
      summary: Execute agent function with version
      description: Executes a specific version of an agent function.
      security:
        - BearerAuth: []
      parameters:
        - name: author
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
                session_id:
                  type: string
                call_depth:
                  type: integer
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  output:
                    type: object
                  execution_id:
                    type: string
                  duration_ms:
                    type: integer
                  cost_usd:
                    type: number
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Agent Runtime Platform - Tool Call
  /v1/agent/tools/{tool_name}/call:
    post:
      tags:
        - AgentRuntime
      summary: Execute agent tool
      description: Executes a named tool with the provided parameters.
      security:
        - BearerAuth: []
      parameters:
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
          description: Tool name (e.g., search.web, browser.navigate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Tool-specific parameters
      responses:
        '200':
          description: Tool execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  tool:
                    type: string
                  data:
                    type: object
                  duration_ms:
                    type: integer
                  cost_usd:
                    type: number
                  execution_id:
                    type: string
        '400':
          description: Execution failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  tool:
                    type: string
                  error_code:
                    type: string
                  error_msg:
                    type: string
                  execution_id:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Agent Runtime Platform - Function Discovery (Legacy)
  /v1/agent/discover:
    get:
      tags:
        - AgentRuntime
      summary: Discover agent functions
      description: Legacy discovery endpoint for agent functions.
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: deterministic
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Discovery results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  results:
                    type: array
                    items:
                      type: object

  # Agent Runtime Platform - Agent Tools (Legacy)
  /v1/agent/tools:
    get:
      tags:
        - AgentRuntime
      summary: List agent tools
      description: Returns all registered tools available to the authenticated agent.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of tools
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  tools:
                    type: array
                    items:
                      type: object
                  costs_usd:
                    type: object

  /.well-known/functionfly.json:
    get:
      tags:
        - WellKnown
      summary: Platform discovery
      description: Returns the platform's public key and metadata for verification.
      security: []
      responses:
        '200':
          description: Platform metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformMetadata'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained from `/auth/login` or `/auth/signup`.
        Pass as `Authorization: Bearer <token>`.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Platform API key for partner integrations.
        Obtain via `POST /v1/partners/{partner_id}/api-keys`.

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Author:
      name: author
      in: path
      required: true
      schema:
        type: string
      description: Function author's username
    FunctionName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Function name

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: integer
          format: int64
          example: 1744000000

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: An error occurred
        detail:
          type: string
          example: Additional error details

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4...
        expires_in:
          type: integer
          description: Seconds until token expiration
          example: 3600
        token_type:
          type: string
          example: Bearer

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: secret123

    SignupRequest:
      type: object
      required:
        - email
        - password
        - username
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        username:
          type: string
          pattern: "^[a-zA-Z0-9_-]{3,20}$"
          example: newuser
        password:
          type: string
          format: password
          minLength: 8
          example: secret123
        invite_code:
          type: string
          example: OPTIONAL-CODE

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    PasswordResetConfirmRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
        new_password:
          type: string
          format: password

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        avatar_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        is_verified:
          type: boolean

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
        avatar_url:
          type: string
          format: uri
        bio:
          type: string
          maxLength: 500

    OAuthProvider:
      type: object
      properties:
        id:
          type: string
          example: github
        name:
          type: string
          example: GitHub
        icon_url:
          type: string
          format: uri

    MFASetupResponse:
      type: object
      properties:
        secret:
          type: string
        otpauth_url:
          type: string
          format: uri
        qr_code:
          type: string
          description: Base64-encoded QR code image

    MFAVerifyRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: TOTP code from authenticator app

    MFAStatusResponse:
      type: object
      properties:
        enabled:
          type: boolean
        method:
          type: string
          enum: [totp, webauthn]
        enrolled_at:
          type: string
          format: date-time

    PaginationParams:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        offset:
          type: integer
          minimum: 0
          default: 0

    PaginatedFunctions:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/FunctionSummary'

    FunctionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        author:
          type: string
        name:
          type: string
        title:
          type: string
        description:
          type: string
        version:
          type: string
          example: 1.0.0
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        runtime:
          type: string
          enum: [node, python, go, rust, wasm]
        rating:
          type: number
          format: double
        downloads:
          type: integer
          format: int64
        is_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FunctionDetail:
      allOf:
        - $ref: '#/components/schemas/FunctionSummary'
        - type: object
          properties:
            manifest:
              type: object
              description: Function manifest (input/output schema, dependencies, etc.)
            source_code:
              type: string
              description: Function source code (only visible to owner)
            readme:
              type: string
            changelog:
              type: array
              items:
                $ref: '#/components/schemas/ChangelogEntry'

    FunctionVersion:
      type: object
      properties:
        version:
          type: string
          example: 1.0.0
        published_at:
          type: string
          format: date-time
        is_latest:
          type: boolean
        is_stable:
          type: boolean
        download_count:
          type: integer

    FunctionVersionDetail:
      allOf:
        - $ref: '#/components/schemas/FunctionVersion'
        - type: object
          properties:
            manifest:
              type: object
            source_code:
              type: string
            changelog:
              $ref: '#/components/schemas/ChangelogEntry'

    ChangelogEntry:
      type: object
      properties:
        version:
          type: string
        date:
          type: string
          format: date-time
        category:
          type: string
          enum: [added, changed, deprecated, removed, fixed, security]
        description:
          type: string

    AISchema:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          description: JSON Schema for function parameters (OpenAI tools format)

