openapi: 3.0.3
info:
  title: FunctionFly Platform API
  description: |
    FunctionFly is a function registry and execution platform with AI composition capabilities.

    ## Authentication

    This API supports two authentication methods:

    - **Bearer Token** (JWT): Obtain via `POST /auth/login` or `POST /auth/signup`
    - **API Key** (Partners): Obtain via `POST /v1/partners/{partner_id}/api-keys`

    ## OpenAI Compatibility

    FunctionFly is designed to work seamlessly with OpenAI's function calling:

    - **Tool Schema**: `GET /registry/functions/{author}/{name}/ai-schema` returns JSON Schema
      compatible with OpenAI's `tools` parameter format
    - **AI Composer**: `POST /ai/composer/generate` and `GET /ai/composer/generate/stream` for
      AI-powered function generation
    - **Streaming**: Server-Sent Events (SSE) streaming responses where indicated

    ## Rate Limits

    Different endpoints have different rate limits:
    - Public endpoints: 60 requests/minute
    - Authenticated endpoints: 300 requests/minute
    - Partner API endpoints: 1000 requests/minute

  version: 1.0.0
  contact:
    email: contact@functionfly.com
  license:
    name: Proprietary
    url: https://functionfly.com/terms

servers:
  - url: https://api.functionfly.com
    description: Production server
  - url: https://api.staging.functionfly.com
    description: Staging server
  - url: http://localhost:8080
    description: Local development server

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Auth
    description: Authentication, sessions, and token management
  - name: Users
    description: User profiles and settings
  - name: Functions
    description: Function registry, search, and execution
  - name: Versions
    description: Function version management
  - name: Playground
    description: Interactive function execution playground
  - name: AI
    description: AI-powered function generation and composition
  - name: Billing
    description: Usage tracking, billing, and wallet management
  - name: Teams
    description: Team and organization management
  - name: Trust
    description: Partner trust scores, attestations, and revocation
  - name: Partners
    description: Partner API key and quota management
  - name: Vault
    description: Encrypted secrets vault
  - name: State
    description: Distributed state fabric
  - name: Monitoring
    description: Metrics, alerts, and system health
  - name: Admin
    description: Administrative operations

paths:
  /health:
    get:
      tags:
        - Monitoring
      summary: Health check
      description: Returns the health status of the API server
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Server is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: |
        Authenticates a user with email/password and returns JWT tokens.
        Tokens are valid for the duration specified in `expires_in`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: secret123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/signup:
    post:
      tags:
        - Auth
      summary: User registration
      description: |
        Creates a new user account. Sends a verification email to the provided address.
        The account is activated after email verification.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              email: user@example.com
              username: newuser
              password: secret123
              invite_code: optional-code
      responses:
        '201':
          description: Account created, verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Email or username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: |
        Exchanges a valid refresh token for a new access token.
        The old refresh token is invalidated after use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-email:
    get:
      tags:
        - Auth
      summary: Verify email address
      description: |
        Verifies a user's email address using a token sent to their email.
        Redirects to the dashboard on success.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Verification token from email link
      responses:
        '302':
          description: Redirect to dashboard on success
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/password-reset:
    post:
      tags:
        - Auth
      summary: Request password reset
      description: Sends a password reset email to the user's registered address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent if account exists
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/password-reset/confirm:
    post:
      tags:
        - Auth
      summary: Confirm password reset
      description: Sets a new password using a valid reset token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid or expired reset token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/mfa/setup:
    post:
      tags:
        - Auth
      summary: Setup MFA
      description: Generates a new TOTP secret for MFA enrollment. Call `verify` after scanning the QR code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - method
              properties:
                method:
                  type: string
                  enum: [totp, webauthn]
                  default: totp
      responses:
        '200':
          description: MFA secret generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFASetupResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/mfa/verify:
    post:
      tags:
        - Auth
      summary: Verify MFA code
      description: Verifies the TOTP code to complete MFA enrollment or verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
      responses:
        '200':
          description: MFA verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFASetupResponse'
        '401':
          description: Invalid MFA code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/mfa/enable:
    post:
      tags:
        - Auth
      summary: Enable MFA
      description: Enables MFA for the authenticated user after successful verification.
      responses:
        '200':
          description: MFA enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    example: true
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/mfa/disable:
    post:
      tags:
        - Auth
      summary: Disable MFA
      description: Disables MFA for the authenticated user. Requires current MFA code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
      responses:
        '200':
          description: MFA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    example: false
        '401':
          description: Invalid MFA code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/mfa/status:
    get:
      tags:
        - Auth
      summary: Get MFA status
      description: Returns the current MFA enrollment status for the authenticated user.
      responses:
        '200':
          description: MFA status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAStatusResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/oauth/providers:
    get:
      tags:
        - Auth
      summary: List OAuth providers
      description: Returns the list of supported OAuth providers for social login.
      security: []
      responses:
        '200':
          description: List of OAuth providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OAuthProvider'

  /auth/oauth/url:
    get:
      tags:
        - Auth
      summary: Get OAuth authorization URL
      description: Returns the authorization URL for the specified OAuth provider.
      security: []
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [github, google, discord, twitter]
        - name: redirect_uri
          in: query
          required: false
          schema:
            type: string
          description: Post-authentication redirect URI
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
        '400':
          description: Invalid provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/oauth/{provider}/callback:
    get:
      tags:
        - Auth
      summary: OAuth callback
      description: Handles the OAuth callback from the identity provider.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [github, google, discord, twitter]
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OAuth authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: OAuth authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      description: Invalidates the current session and refresh token.
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: logged out

  /auth/api-key:
    post:
      tags:
        - Auth
      summary: Authenticate with API key
      description: |
        Validates a platform API key and returns a short-lived JWT for programmatic access.
        Use this endpoint to obtain tokens for CI/CD pipelines and automated workflows.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - api_key
              properties:
                api_key:
                  type: string
                  description: Platform API key (ff_live_...)
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      tags:
        - Users
      summary: Get current user
      description: Returns the profile of the authenticated user.
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Users
      summary: Update current user
      description: Updates the profile of the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{username}:
    get:
      tags:
        - Users
      summary: Get user profile
      description: Returns the public profile of any user by username.
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/registry/functions:
    get:
      tags:
        - Functions
      summary: List functions
      description: Returns a paginated list of all public functions in the registry.
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category
        - name: runtime
          in: query
          schema:
            type: string
          description: Filter by runtime (node, python, go, rust, wasm)
        - name: search
          in: query
          schema:
            type: string
          description: Full-text search query
        - name: sort
          in: query
          schema:
            type: string
            enum: [downloads, rating, created_at, updated_at]
            default: downloads
      responses:
        '200':
          description: List of functions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFunctions'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Functions
      summary: Delete all functions
      description: Deletes all functions owned by the authenticated user.
      responses:
        '204':
          description: All functions deleted
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/registry/functions/{author}/{name}:
    get:
      tags:
        - Functions
      summary: Get function
      description: Returns the details of a specific function including its manifest and metadata.
      security: []
      parameters:
        - $ref: '#/components/parameters/Author'
        - $ref: '#/components/parameters/FunctionName'
      responses:
        '200':
          description: Function details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionDetail'
        '404':
          description: Function not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Functions
      summary: Delete function
      description: Deletes a function and all its versions. Requires ownership.
      parameters:
        - $ref: '#/components/parameters/Author'
        - $ref: '#/components/parameters/FunctionName'
      responses:
        '204':
          description: Function deleted
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the function owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Function not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/registry/functions/{author}/{name}/ai-schema:
    get:
      tags:
        - Functions
        - AI
      summary: Get OpenAI function schema
      description: |
        Returns the function's parameter schema in OpenAI's function calling format.
        Use this endpoint to populate the `tools` parameter when calling GPT-4 or Claude.
      security: []
      parameters:
        - $ref: '#/components/parameters/Author'
        - $ref: '#/components/parameters/FunctionName'
        - name: version
          in: query
          description: Specific version to get schema for
          schema:
            type: string
      responses:
        '200':
          description: OpenAI-compatible function schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISchema'
              example:
                name: get_weather
                description: Get the current weather for a location
                parameters:
                  type: object
                  properties:
                    location:
                      type: string
                      description: City name
                    unit:
                      type: string
                      enum: [celsius, fahrenheit]
                  required: [location]
        '404':
          description: Function not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/registry/functions/{author}/{name}/versions:
    get:
      tags:
        - Versions
      summary: List function versions
      description: Returns all published versions of a function.
      security: []
      parameters:
        - $ref: '#/components/parameters/Author'
        - $ref: '#/components/parameters/FunctionName'
      responses:
        '200':
          description: List of versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FunctionVersion'

  /v1/registry/search:
    get:
      tags:
        - Functions
      summary: Search functions
      description: Full-text and semantic search across the function registry.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: category
          in: query
          schema:
            type: string
        - name: runtime
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, downloads, rating]
            default: relevance
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFunctions'

  /v1/functions/{functionId}/versions:
    get:
      tags:
        - Versions
      summary: List function versions by ID
      description: Returns all versions for a function identified by its UUID.
      parameters:
        - name: functionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FunctionVersion'

  /v1/functions/{functionId}/versions/{version}:
    get:
      tags:
        - Versions
      summary: Get function version
      description: Returns the details of a specific function version.
      parameters:
        - name: functionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Version details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionVersionDetail'
        '404':
          description: Version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/run/{author}/{name}/execute:
    post:
      tags:
        - Playground
      summary: Execute function
      description: |
        Executes a function with the provided input parameters and returns the result.
        Supports streaming responses for long-running functions via the `Accept: text/event-stream` header.
      security: []
      parameters:
        - $ref: '#/components/parameters/Author'
        - $ref: '#/components/parameters/FunctionName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Function input parameters (schema defined in function manifest)
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
            text/event-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Function not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/run/{appSlug}/{functionName}/execute:
    post:
      tags:
        - Playground
      summary: Execute app function
      description: Executes a function belonging to a specific app (organization).
      security: []
      parameters:
        - name: appSlug
          in: path
          required: true
          schema:
            type: string
        - name: functionName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        '404':
          description: Function not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/ai/composer/generate:
    post:
      tags:
        - AI
      summary: Generate function (AI Composer)
      description: |
        Generates a new function from a natural language description using AI.
        The generated function is returned as source code ready for review and publishing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIGenerateRequest'
            example:
              description: A function that sends an email via SendGrid
              runtime: node
              category: notifications
              tags: [email, notifications]
      responses:
        '200':
          description: Generated function
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIGenerateResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/ai/composer/generate/stream:
    get:
      tags:
        - AI
      summary: Generate function with streaming
      description: |
        Streams the AI-generated function code as it is being written.
        Uses Server-Sent Events (SSE) for real-time streaming.
      parameters:
        - name: description
          in: query
          required: true
          schema:
            type: string
          description: Natural language description of the desired function
        - name: runtime
          in: query
          schema:
            type: string
            default: node
          description: Target runtime
        - name: category
          in: query
          schema:
            type: string
          description: Function category
      responses:
        '200':
          description: Streaming function code
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/ai/health:
    get:
      tags:
        - AI
      summary: AI service health
      description: Returns the health status of the AI service backing the composer.
      security: []
      responses:
        '200':
          description: AI service status
          content:
            application/json:
              schema:
                type: object
