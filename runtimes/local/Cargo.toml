[package]
name = "functionfly-local"
version = "0.1.0"
edition = "2021"
description = "Local FunctionFly runtime for development"
authors = ["FunctionFly"]

[dependencies]
wasmtime = "42.0.0"
wasmtime-wasi = "42.0.0"
tokio = { version = "1.49.0", features = ["full", "fs"] }
axum = { version = "0.8.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-appender = "0.2.4"
anyhow = "1.0.101"
clap = { version = "4.5.59", features = ["derive"] }
reqwest = { version = "0.13.2", features = ["blocking"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace", "cors"] }
uuid = { version = "1.21.0", features = ["v4"] }
chrono = { version = "0.4.43", features = ["serde"] }
sha2 = "0.10.9"
hmac = "0.12.1"
hex = "0.4.3"
lru = "0.16.3"
futures = "0.3.31"
rustpython-vm = "0.4.0"
lettre = { version = "0.11.14", features = ["tokio1", "tokio1-native-tls"] }
tract-onnx = "0.22.0"
once_cell = "1.21.3"
governor = "0.10.4"  # For rate limiting external API calls
url = "2.5.8"  # For URL parsing and validation
regex = "1.12.3"  # For security pattern matching
tempfile = "3.25.0"  # For temporary directory creation in tests
wat = "1.245.1"  # WAT to WASM compilation (wrapper generator)
prometheus = { version = "0.14.0", features = ["process"] }  # Prometheus metrics export
quinn-proto = "0.11.14"  # Pin patched version (CVE: unauthenticated remote DoS)
aws-lc-sys = "0.38.0"    # Pin patched version (CVE: PKCS7_verify cert chain validation bypass)
libc = "0.2"             # For raw seccomp syscalls (Linux only)

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
