[package]
name = "functionfly-local"
version = "0.1.0"
edition = "2021"
description = "Local FunctionFly runtime for development"
authors = ["FunctionFly"]

[features]
default = ["memory", "observability"]
memory = ["dep:redis", "dep:tokio-postgres", "dep:pgvector"]
observability = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]

[dependencies]
wasmtime = "42.0.0"
wasmtime-wasi = "42.0.0"
tokio = { version = "1.49.0", features = ["full", "fs"] }
axum = { version = "0.8.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
async-trait = "0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tracing-appender = "0.2.4"
tracing-opentelemetry = { version = "0.29.0", optional = true }
opentelemetry = { version = "0.28", optional = true }
opentelemetry-otlp = { version = "0.28.0", optional = true, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.28", optional = true, features = ["rt-tokio"] }
anyhow = "1.0.101"
clap = { version = "4.5.59", features = ["derive"] }
reqwest = { version = "0.13.2", features = ["json", "stream", "blocking", "multipart"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace", "cors"] }
uuid = { version = "1.21.0", features = ["v4", "serde"] }
chrono = { version = "0.4.43", features = ["serde"] }
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
lru = "0.17.0"
dashmap = "6.1.0"
futures = "0.3.31"
rustpython-vm = "0.5.0"
rustpython-stdlib = "0.5.0"
lettre = { version = "0.11.14", features = ["tokio1", "tokio1-native-tls"] }
thiserror = "2.0.18"   # For scheduler error types
tract-onnx = "0.22.0"
once_cell = "1.21.3"
governor = "0.10.4"  # For rate limiting external API calls
url = "2.5.8"  # For URL parsing and validation
regex = "1.12.3"  # For security pattern matching
tempfile = "3.25.0"  # For temporary directory creation in tests
wat = "1.245.1"  # WAT to WASM compilation (wrapper generator)
prometheus = { version = "0.14.0", features = ["process"] }  # Prometheus metrics export
base64 = "0.22"  # For Python cache endpoint base64 encoding
quinn-proto = "0.11.14"  # Pin patched version (CVE: unauthenticated remote DoS)
aws-lc-sys = "0.40.0"    # Pin patched version (CVE: PKCS7_verify cert chain validation bypass)
libc = "0.2.185"             # For raw seccomp syscalls (Linux only)
redis = { version = "1.2.0", optional = true, features = ["aio", "tokio-comp"] }  # Warm memory tier (Redis)
tokio-postgres = { version = "0.7.17", optional = true, features = ["with-uuid-1", "with-chrono-0_4"] }  # Cold memory tier (PostgreSQL)
pgvector = { version = "0.4.1", optional = true, features = ["postgres"] }  # Vector similarity search (pgvector)
postcard = "1.1.3"  # For state graph memory serialization
serde_urlencoded = "0.7"  # For Stripe form encoding

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "pool_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Test profile: balance between compile time and runtime speed
[profile.test]
opt-level = 1              # Enable basic optimizations (faster than 0, compiles faster than 3)
debug = true               # Keep debug info for test failures
debug-assertions = true    # Keep assertions enabled
overflow-checks = true     # Keep overflow checks
lto = false                # Disable LTO for faster linking
codegen-units = 16         # More codegen units = faster compilation
panic = "unwind"           # Unwind is faster for tests

# Dev profile optimization for faster iterative builds
[profile.dev]
opt-level = 0
debug = true
lto = false
codegen-units = 16
panic = "unwind"

# Fast test profile for CI: optimized but still fast to compile
[profile.fast-test]
inherits = "test"
opt-level = 2
codegen-units = 4

# Integration test profile - for tests that need release-level speed
[profile.test-release]
inherits = "release"
debug = true
debug-assertions = true
lto = "thin"
