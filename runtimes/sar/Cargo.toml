[package]
name = "functionfly-sar"
version = "0.1.0"
edition = "2021"
description = "FunctionFly Stateful Agent Runtime - Event-driven AI agent execution engine"
authors = ["FunctionFly Team"]
license = "MIT"

[features]
default = ["nats-events", "wasm-sandbox", "multi-memory"]
nats-events = ["dep:nats"]
wasm-sandbox = ["dep:wasmtime", "dep:wasmtime-wasi"]
multi-memory = ["dep:redis", "dep:lru"]

[dependencies]
tokio = { version = "1.49", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
uuid = { version = "1.21", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
dashmap = "6.1"
parking_lot = "0.12"
thiserror = "2.0"
once_cell = "1.21"
lru = { version = "0.12", optional = true }
reqwest = { version = "0.12", features = ["json"] }

wasmtime = { version = "33.0", optional = true }
wasmtime-wasi = { version = "33.0", optional = true }

nats = { version = "0.26", optional = true }

redis = { version = "1.2.0", optional = true, features = ["tokio-comp", "connection-manager"] }

opentelemetry = "0.29"
opentelemetry_sdk = "0.28"

prometheus = "0.14"
clap = { version = "4.5", features = ["derive", "env"] }

[lib]
name = "sar_runtime"
path = "src/lib.rs"

[[bin]]
name = "functionfly-sar"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1