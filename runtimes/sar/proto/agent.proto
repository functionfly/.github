syntax = "proto3";

package agent.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

service AgentRegistry {
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc UnregisterAgent(UnregisterAgentRequest) returns (UnregisterAgentResponse);
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ExecuteAgent(ExecuteAgentRequest) returns (ExecuteAgentResponse);
}

message RegisterAgentRequest {
  string name = 1;
  GraphDefinition graph = 2;
  uint32 priority = 3;
  uint32 max_concurrent_cells = 4;
  bool isolation_enabled = 5;
  repeated string event_subscriptions = 6;
  map<string, string> metadata = 7;
}

message GraphDefinition {
  string id = 1;
  string name = 2;
  repeated NodeDefinition nodes = 3;
  repeated EdgeDefinition edges = 4;
}

message NodeDefinition {
  string id = 1;
  string name = 2;
  NodeType type = 3;
  uint64 timeout_ms = 4;
  RetryPolicy retry = 5;
  google.protobuf.Struct input_schema = 6;
  google.protobuf.Struct output_schema = 7;
  map<string, string> metadata = 8;
}

message NodeType {
  oneof type {
    LLMNode llm = 1;
    ToolNode tool = 2;
    MemoryNode memory = 3;
    ControlNode control = 4;
    OptimizationNode optimization = 5;
    ActionNode action = 6;
    PassthroughNode passthrough = 7;
  }
}

message LLMNode {
  string model = 1;
  string prompt = 2;
  float temperature = 3;
  uint32 max_tokens = 4;
  LlmTrafficType traffic_type = 5;
}

message ToolNode {
  string name = 1;
  google.protobuf.Struct params = 2;
}

message MemoryNode {
  MemoryOp operation = 1;
  string key = 2;
}

message ControlNode {
  ControlKind kind = 1;
  string condition = 2;
}

message OptimizationNode {
  OptStrategy strategy = 1;
}

message ActionNode {
  string connector = 1;
  string action = 2;
  google.protobuf.Struct params = 3;
}

message PassthroughNode {}

enum LlmTrafficType {
  LLM_TRAFFIC_TYPE_UNSPECIFIED = 0;
  LLM_TRAFFIC_TYPE_REALTIME = 1;
  LLM_TRAFFIC_TYPE_STRUCTURED = 2;
  LLM_TRAFFIC_TYPE_FUNCTION_CALLING = 3;
  LLM_TRAFFIC_TYPE_BACKGROUND = 4;
  LLM_TRAFFIC_TYPE_GENERAL = 5;
}

enum MemoryOp {
  MEMORY_OP_UNSPECIFIED = 0;
  MEMORY_OP_READ = 1;
  MEMORY_OP_WRITE = 2;
  MEMORY_OP_DELETE = 3;
  MEMORY_OP_LIST = 4;
}

enum ControlKind {
  CONTROL_KIND_UNSPECIFIED = 0;
  CONTROL_KIND_IF = 1;
  CONTROL_KIND_LOOP = 2;
  CONTROL_KIND_SWITCH = 3;
}

enum OptStrategy {
  OPT_STRATEGY_UNSPECIFIED = 0;
  OPT_STRATEGY_ADJUST_TIMEOUTS = 1;
  OPT_STRATEGY_ENABLE_CACHING = 2;
  OPT_STRATEGY_INCREASE_QUOTA = 3;
  OPT_STRATEGY_SIMPLIFY_PATH = 4;
}

message RetryPolicy {
  uint32 max_attempts = 1;
  uint64 initial_delay_ms = 2;
  uint64 max_delay_ms = 3;
  double backoff_multiplier = 4;
}

message EdgeDefinition {
  string id = 1;
  string source = 2;
  string target = 3;
  EdgeType edge_type = 4;
  string mapping = 5;
}

enum EdgeType {
  EDGE_TYPE_UNSPECIFIED = 0;
  EDGE_TYPE_DATA_FLOW = 1;
  EDGE_TYPE_TRIGGER = 2;
  EDGE_TYPE_DEPENDENCY = 3;
}

message RegisterAgentResponse {
  Agent agent = 1;
}

message UnregisterAgentRequest {
  string agent_id = 1;
}

message UnregisterAgentResponse {
  bool success = 1;
}

message GetAgentRequest {
  string agent_id = 1;
}

message GetAgentResponse {
  Agent agent = 1;
}

message ListAgentsRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  string next_page_token = 2;
}

message UpdateAgentRequest {
  string agent_id = 1;
  optional string name = 2;
  optional GraphDefinition graph = 3;
  optional uint32 priority = 4;
  optional uint32 max_concurrent_cells = 5;
  optional bool isolation_enabled = 6;
  repeated string event_subscriptions = 7;
  map<string, string> metadata = 8;
}

message UpdateAgentResponse {
  Agent agent = 1;
}

message HeartbeatRequest {
  string agent_id = 1;
  AgentStatus status = 2;
  map<string, string> metrics = 3;
}

message HeartbeatResponse {
  google.protobuf.Timestamp next_heartbeat = 1;
}

message ExecuteAgentRequest {
  string agent_id = 1;
  google.protobuf.Struct input = 2;
  string tenant_id = 3;
}

message ExecuteAgentResponse {
  string execution_id = 1;
  ExecutionStatus status = 2;
  google.protobuf.Struct output = 3;
  string error = 4;
  map<string, NodeResult> node_results = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp completed_at = 7;
  uint64 total_duration_ms = 8;
}

message NodeResult {
  string node_id = 1;
  google.protobuf.Value output = 2;
  string error = 3;
  uint64 duration_ms = 4;
  uint32 attempts = 5;
  ExecutionStatus status = 6;
}

enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_PENDING = 1;
  EXECUTION_STATUS_RUNNING = 2;
  EXECUTION_STATUS_COMPLETED = 3;
  EXECUTION_STATUS_FAILED = 4;
  EXECUTION_STATUS_CANCELLED = 5;
}

message Agent {
  string id = 1;
  string name = 2;
  GraphDefinition graph = 3;
  uint32 priority = 4;
  uint32 max_concurrent_cells = 5;
  bool isolation_enabled = 6;
  repeated string event_subscriptions = 7;
  map<string, string> metadata = 8;
  AgentStatus status = 9;
  google.protobuf.Timestamp registered_at = 10;
  google.protobuf.Timestamp last_heartbeat = 11;
  AgentMetrics metrics = 12;
}

enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_IDLE = 1;
  AGENT_STATUS_RUNNING = 2;
  AGENT_STATUS_WAITING_FOR_EVENT = 3;
  AGENT_STATUS_PAUSED = 4;
  AGENT_STATUS_FAILED = 5;
}

message AgentMetrics {
  uint64 total_executions = 1;
  uint64 successful_executions = 2;
  uint64 failed_executions = 3;
  double average_latency_ms = 4;
  double total_cost_usd = 5;
  google.protobuf.Timestamp last_executed_at = 6;
}

service OrchestratorComm {
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream EventMessage);
  rpc PublishEvent(PublishEventRequest) returns (PublishEventResponse);
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);
}

message SubscribeEventsRequest {
  string agent_id = 1;
  repeated string subjects = 2;
}

message EventMessage {
  string id = 1;
  EventSource source = 2;
  string subject = 3;
  google.protobuf.Struct payload = 4;
  map<string, string> metadata = 5;
  google.protobuf.Timestamp timestamp = 6;
}

message EventSource {
  oneof source {
    WebhookSource webhook = 1;
    DatabaseSource database = 2;
    MessageQueueSource message_queue = 3;
    InternalAgentSource internal_agent = 4;
    CronSource cron = 5;
    ApiSource api = 6;
  }
}

message WebhookSource {
  string url = 1;
}

message DatabaseSource {}

message MessageQueueSource {}

message InternalAgentSource {
  string agent_id = 1;
}

message CronSource {}

message ApiSource {}

message PublishEventRequest {
  string subject = 1;
  google.protobuf.Struct payload = 2;
  map<string, string> metadata = 3;
}

message PublishEventResponse {
  bool success = 1;
}

message ReportStatusRequest {
  string runtime_id = 1;
  RuntimeStatus status = 2;
  RuntimeMetrics metrics = 3;
}

message RuntimeStatus {
  bool healthy = 1;
  uint32 active_agents = 2;
  uint32 running_executions = 3;
  uint32 queued_tasks = 4;
  string version = 5;
}

message RuntimeMetrics {
  double cpu_usage_percent = 1;
  double memory_usage_bytes = 2;
  uint64 total_executions = 3;
  uint64 failed_executions = 4;
}

message ReportStatusResponse {
  google.protobuf.Timestamp next_report = 1;
}