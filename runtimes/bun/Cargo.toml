[package]
name = "functionfly-bun-runtime"
version = "0.1.0"
edition = "2021"
description = "FunctionFly Bun Runtime - Secure production-ready JavaScript/TypeScript execution"
authors = ["FunctionFly Team"]
license = "MIT"

[features]
default = ["wasm-sandbox", "secure-execution", "resource-limits", "js-engine", "nats-client"]
secure-execution = ["dep:seccomp", "dep:landlock"]
wasm-sandbox = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:regex"]
js-engine = ["dep:rquickjs"]
resource-limits = []
nats-client = ["dep:async-nats", "dep:bytes"]

[dependencies]
constant_time_eq = "0.5.0"
tokio = { version = "1.49", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
async-trait = "0.1.89"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3"
dashmap = "6.2.1"
parking_lot = "0.12"
thiserror = "2.0"
once_cell = "1.21"

# Security
seccomp = { version = "0.1", optional = true }
landlock = { version = "0.4.5", optional = true }

# WASM sandbox
wasmtime = { version = "45.0.1", optional = true }
wasmtime-wasi = { version = "45.0.1", optional = true, features = ["p1"] }

# Code security verification
regex = { version = "1.12.4", optional = true }

# JavaScript engine (QuickJS bindings)
rquickjs = { version = "0.12.0", optional = true, features = ["futures", "loader"] }

# NATS client for orchestrator communication
async-nats = { version = "0.49.1", optional = true }
bytes = { version = "1.5", optional = true }

# Rate limiting
governor = "0.10.4"

# OS-level resource limits (RLIMIT_*) on Linux
libc = "0.2"

# HTTP request body size limit
http-body-util = "0.1"

[dev-dependencies]
mockall = "0.14.0"

# Production release profile: optimized for fast startup, small binary, and
# guaranteed unwind-safe teardown. LTO + single codegen unit lets the linker
# strip dead code and inline across crate boundaries; strip removes symbol
# info; panic = "abort" avoids unwinding tables that would otherwise bloat
# the binary and complicate signal handling.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = false

# Release-with-debug: same as release but keeps debug info for production
# crash reports. Used by the publish/release pipeline.
[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"

# Test profile: small unit-count and overflow checks on for catching bugs
# early; debuginfo on for readable backtraces.
[profile.test]
opt-level = 1
debug = true
overflow-checks = true
lto = false

# Fast-test profile: used by CI for the fast lane. Inherits `test` but
# bumps optimization to keep long-running async tests snappy.
[profile.fast-test]
inherits = "test"
opt-level = 2
codegen-units = 4
