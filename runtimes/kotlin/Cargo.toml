[package]
name = "functionfly-kotlin-runtime"
version = "0.1.0"
edition = "2021"
description = "FunctionFly Kotlin Runtime - Secure production-ready Kotlin/JVM execution"
authors = ["FunctionFly Team"]
license = "MIT"

[features]
default = ["wasm-sandbox", "secure-execution", "resource-limits", "jvm-execution", "nats-client"]
secure-execution = ["dep:seccomp", "dep:landlock"]
wasm-sandbox = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:regex"]
jvm-execution = []
resource-limits = ["governor"]
nats-client = ["dep:nats"]

[dependencies]
constant_time_eq = "0.5.0"
tokio = { version = "1.49", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3"
dashmap = "6.2.1"
parking_lot = "0.12"
thiserror = "2.0"
once_cell = "1.21"

# Security
seccomp = { version = "0.1", optional = true }
landlock = { version = "0.4.5", optional = true }

# WASM sandbox
wasmtime = { version = "45.0.1", optional = true }
wasmtime-wasi = { version = "45.0.1", optional = true, features = ["p1"] }

# Code security verification
regex = { version = "1.12.4", optional = true }

# NATS client for orchestrator communication
nats = { version = "0.26", optional = true }

# Rate limiting
governor = { version = "0.10.4", optional = true }

# Prometheus metrics
prometheus-client = "0.24"

# Tower HTTP utilities
tower-http = { version = "0.6.11", features = ["trace"] }

# Process management for JVM
os_info = "3.15.0"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
mockall = "0.14.0"

[lib]
name = "kotlin_runtime"
path = "src/lib.rs"

[[bin]]
name = "functionfly-kotlin"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
lto = false
codegen-units = 16
panic = "unwind"
