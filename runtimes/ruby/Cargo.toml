[package]
name = "functionfly-ruby-runtime"
version = "0.1.0"
edition = "2021"
description = "FunctionFly Ruby Runtime - Secure production-ready Ruby execution"
authors = ["FunctionFly Team"]
license = "MIT"

[features]
default = ["wasm-sandbox", "secure-execution", "resource-limits", "ruby-engine", "nats-client"]
secure-execution = ["dep:seccomp", "dep:landlock"]
wasm-sandbox = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:regex"]
ruby-engine = ["dep:rutie"]
resource-limits = []
nats-client = ["dep:async-nats", "dep:bytes"]

[dependencies]
constant_time_eq = "0.5.0"
tokio = { version = "1.49", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3"
dashmap = "6.2.1"
parking_lot = "0.12"
thiserror = "2.0"
once_cell = "1.21"

# Security
seccomp = { version = "0.1", optional = true }
landlock = { version = "0.4.5", optional = true }

# WASM sandbox
wasmtime = { version = "45.0.1", optional = true }
wasmtime-wasi = { version = "45.0.1", optional = true, features = ["p1"] }

# Code security verification
regex = { version = "1.12.4", optional = true }

# Ruby engine (requires Ruby installed on system)
rutie = { version = "0.9.0", optional = true }

# NATS client for orchestrator communication
async-nats = { version = "0.49.1", optional = true }
bytes = { version = "1.5", optional = true }

# SHA256 for code hashing
sha2 = "0.11"
hex = "0.4"

# System interfaces
libc = "0.2"

# Base64 encoding
base64 = "0.22"

[dev-dependencies]
mockall = "0.14"

[lib]
name = "ruby_runtime"
path = "src/lib.rs"

[[bin]]
name = "functionfly-ruby"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = false

[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"

[profile.test]
opt-level = 1
debug = true
overflow-checks = true
lto = false

[profile.fast-test]
inherits = "test"
opt-level = 2
codegen-units = 4
