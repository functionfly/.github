[package]
name = "functionfly-microvm"
version = "0.1.0"
edition = "2021"
description = "Firecracker MicroVM orchestrator for CPython execution"

[dependencies]
# Async runtime
tokio = { version = "1.49.0", features = ["full"] }

# HTTP client for Firecracker API
reqwest = { version = "0.13.2", features = ["json", "rustls"], default-features = false }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID for VM identification
uuid = { version = "1.6", features = ["v4", "serde"] }

# CLI parsing
clap = { version = "4.5.60", features = ["derive"] }

# Async channels
async-channel = "2.1"

# Process management
portable-pty = "0.9.0"

# Network utilities
socket2 = "0.6.2"

# Vsock support
vsock = "0.5.2"

# HTTP server (axum is lightweight)
axum = { version = "0.8.8", features = ["json"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors"] }

[dev-dependencies]
tempfile = "3.25.0"

# Test profile: balance between compile time and runtime speed
[profile.test]
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16
panic = "unwind"

# Fast test profile for CI: optimized but still fast to compile
[profile.fast-test]
inherits = "test"
opt-level = 2
codegen-units = 4

# Integration test profile - for tests that need release-level speed
[profile.test-release]
inherits = "release"
debug = true
debug-assertions = true
lto = "thin"
