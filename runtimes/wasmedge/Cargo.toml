[package]
name = "functionfly-wasmedge-runtime"
version = "0.1.0"
edition = "2021"
description = "FunctionFly WasmEdge Runtime - Production-ready C/C++ and WASM execution"
authors = ["FunctionFly Team"]
license = "MIT"

[features]
default = ["wasm-sandbox", "secure-execution", "resource-limits", "nats-client"]
secure-execution = ["dep:seccomp", "dep:landlock"]
wasm-sandbox = ["dep:wasmedge-sdk"]
resource-limits = []
nats-client = ["dep:nats"]

[dependencies]
tokio = { version = "1.49", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
async-trait = "0.1.89"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3"
dashmap = "6.2.1"
parking_lot = "0.12"
thiserror = "2.0"
once_cell = "1.21"

# Security
seccomp = { version = "0.1", optional = true }
landlock = { version = "0.4.5", optional = true }

# WasmEdge runtime - C/C++ via wasm32-wasi
# WASI support is included in wasmedge-sdk
wasmedge-sdk = { version = "0.14", optional = true }

# NATS client for orchestrator communication
nats = { version = "0.26", optional = true }

# Rate limiting
governor = "0.10.4"

# URL parsing for security
url = "2.5"

# Base64 encoding for WASM binaries
base64 = "0.22"

[dev-dependencies]
mockall = "0.14.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
lto = false
codegen-units = 16
panic = "unwind"
