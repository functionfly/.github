[package]
name = "functionfly-nodejs-runtime"
version = "0.1.0"
edition = "2021"
description = "FunctionFly Node.js Runtime - QuickJS WASM-based JavaScript execution"
authors = ["FunctionFly Team"]
license = "MIT"

[features]
default = ["js", "wasmtime"]
js = ["dep:rquickjs"]
wasmtime = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
constant_time_eq = "0.5.0"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["json"] }
log = "0.4.32"
thiserror = "2.0"
anyhow = "1.0.102"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
http = "1.4.2"
reqwest = { version = "0.13.4", features = ["json"] }
parking_lot = "0.12"
futures = "0.3"
prometheus-client = "0.24"
sha2 = "0.11.0"
hex = "0.4"
regex = "1.12.4"
once_cell = "1.20"
clap = { version = "4.5", features = ["derive"] }
axum = "0.8"
tower-http = { version = "0.6.11", features = ["trace"] }
base64 = "0.22"

rquickjs = { version = "0.12.0", optional = true, features = ["futures", "loader"] }
wasmtime = { version = "45.0.1", optional = true }
wasmtime-wasi = { version = "45.0.1", optional = true }

[lib]
name = "nodejs_runtime"
path = "src/lib.rs"

[[bin]]
name = "functionfly-nodejs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
