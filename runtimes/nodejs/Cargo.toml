[package]
name = "functionfly-nodejs-runtime"
version = "0.1.0"
edition = "2021"
description = "FunctionFly Node.js Runtime - QuickJS WASM-based JavaScript execution"
authors = ["FunctionFly Team"]
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["json"] }
log = "0.4"

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.102"
async-trait = "0.1.89"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Time handling
chrono = { version = "0.4.44", features = ["serde"] }

# UUID for execution IDs
uuid = { version = "1.22.0", features = ["v4", "serde"] }

# HTTP types
http = "1.4.0"
reqwest = { version = "0.13.2", features = ["json"] }

# WASM support: high-level QuickJS WASM bindings (Bytecode Alliance/javy)
quickjs-wasm-rs = "3.1.0"

# Resource limiting
parking_lot = "0.12.5"

# Concurrency primitives
futures = "0.3.32"

# Metrics
prometheus-client = "0.24.0"

# Hashing for cache keys (content-addressable)
sha2 = "0.11.0"
hex = "0.4"

# Regex for security pattern matching
regex = "1.11"

# Lazy static initialization
once_cell = "1.20"

# CLI dependencies
clap = { version = "4.5", features = ["derive"] }
axum = "0.8.9"
tower-http = { version = "0.6", features = ["trace"] }
base64 = "0.22"

[target.'cfg(not(target_env = "wasm32"))'.dependencies]
# Non-WASM specific dependencies
wasmtime = "42.0.0"  # 24.0.6+ fixes panic in wasi:http/types.fields (CVE)

[lib]
name = "nodejs_runtime"
path = "src/lib.rs"

[[bin]]
name = "functionfly-nodejs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
