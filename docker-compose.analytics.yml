# Umami Analytics - Self-hosted, GDPR-compliant web analytics
# Usage: docker compose -f docker-compose.analytics.yml up -d
# Access: http://localhost:3000 (default admin: umami / umami)

services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    network_mode: host
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/umami?sslmode=disable
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET:-change-me-in-production}
    volumes:
      - umami_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  umami_data:
