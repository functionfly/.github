# Flags vulnerable dependencies introduced on pull requests (requires Dependency graph / Dependabot data).
name: Dependency review

on:
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: moderate

      - name: Mark dependency review as non-blocking when unsupported
        run: echo "Dependency review completed (non-blocking in repos without GH Advanced Security)."
