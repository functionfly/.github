# Flags vulnerable dependencies introduced on pull requests (requires Dependency graph / Dependabot data).
name: Dependency review

on:
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
