name: Deploy Blog API to Fly.io

on:
  push:
    branches: [main, master]
    paths:
      - "cmd/blog-api/**"
      - ".github/workflows/blog-api-deploy.yml"
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Blog API
        working-directory: ./cmd/blog-api
        run: |
          echo "Deploying Blog API to Fly.io..."
          flyctl deploy --remote-only

      - name: Verify deployment health
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 15

          # Check health via Fly's proxy
          flyctl proxy 3000:3000 --app functionfly-blog-api &
          PROXY_PID=$!
          sleep 5

          HEALTH_STATUS=$(curl -sf http://localhost:3000/api/v1/blog/posts?page=1&limit=1 && echo "healthy" || echo "unhealthy")
          kill $PROXY_PID 2>/dev/null || true

          if [ "$HEALTH_STATUS" != "healthy" ]; then
            echo "❌ Health check failed!"
            exit 1
          fi

          echo "✅ Blog API deployed and healthy!"
