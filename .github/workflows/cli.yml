# .github/workflows/cli.yml
# GitHub Actions workflow for CLI releases
# Triggered on git tags matching v* (e.g., v1.0.0)
# Uses GoReleaser to build and release the CLI

name: CLI Release

on:
  push:
    tags:
      - 'v*'

# Required secrets:
# - GITHUB_TOKEN: Automatically provided by GitHub Actions
# - GORELEASER_KEY: GoReleaser Pro key (optional for Pro features)

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
