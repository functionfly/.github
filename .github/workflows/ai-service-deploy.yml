name: Deploy AI Service to Fly.io

on:
  push:
    branches: [main, master]
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-deploy.yml'
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy AI Service
        working-directory: ./ai-service
        run: |
          echo "Deploying AI Service to Fly.io..."
          flyctl deploy --remote-only

      - name: Verify deployment health
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 15
          
          # Check health via Fly's proxy (temporary)
          flyctl proxy 8081:8081 --app functionfly-ai-service &
          PROXY_PID=$!
          sleep 5
          
          HEALTH_STATUS=$(curl -sf http://localhost:8081/health && echo "healthy" || echo "unhealthy")
          kill $PROXY_PID 2>/dev/null || true
          
          if [ "$HEALTH_STATUS" != "healthy" ]; then
            echo "❌ Health check failed!"
            exit 1
          fi
          
          echo "✅ AI Service deployed and healthy!"
