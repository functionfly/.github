name: Admin Dashboard CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'web/admin-dashboard/**'
      - '.github/workflows/admin-dashboard-ci.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'web/admin-dashboard/**'
      - '.github/workflows/admin-dashboard-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same branch on new pushes.
concurrency:
  group: admin-dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Static type-check (strict). Tsc only — no emit, no Vite.
  typecheck:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/admin-dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: bun

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.34

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

  # 2) Production build via Vite. Builds the SPA artifact that ships.
  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/admin-dashboard
    env:
      # CI builds must not depend on a real backend; a placeholder URL
      # is fine because Vite only resolves it at runtime, not at build time.
      VITE_API_BASE_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: bun

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.34

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Vite build
        run: bun run build:vite

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dashboard-dist
          path: web/admin-dashboard/dist
          retention-days: 3
          if-no-files-found: error

  # 3) Unit tests (Vitest).
  unit-tests:
    name: Vitest unit tests
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/admin-dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: bun

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.34

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run vitest (single pass)
        run: bunx vitest run --reporter=default

  # 4) Lint (best-effort; pre-existing issues should not block but we
  #    still surface them as a separate job so trends are visible).
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: web/admin-dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: bun

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.34

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint
