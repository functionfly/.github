name: Deploy to Fly.io Staging

on:
  push:
    branches: [ develop ]
    paths:
      - 'cmd/orchestrator-api/**'
      - 'internal/api/**'
      - 'internal/storage/**'
      - 'internal/deployment/**'
      - 'deploy/fly/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
  GO_VERSION: '1.24'

jobs:
  deploy:
    name: Deploy Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get Go modules cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@main

      - name: Deploy to Fly.io Staging
        run: |
          flyctl deploy --config deploy/fly/functionfly-control/fly.toml --remote-only
        working-directory: .

      - name: Deploy Status Check
        run: |
          flyctl status --app functionfly-control
