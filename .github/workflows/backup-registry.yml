name: Registry Backup and Verification

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Only verify latest backup (no new backup)'
        type: boolean
        default: false
      list_backups:
        description: 'List available backups'
        type: boolean
        default: false

env:
  GO_VERSION: '1.23'
  BACKUP_RETENTION_DAYS: '30'

concurrency:
  group: registry-backup
  cancel-in-progress: false

jobs:
  # Daily backup job
  backup:
    name: Registry Backup
    runs-on: ubuntu-latest
    if: ${{ !inputs.verify_only && !inputs.list_backups }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install
          rm -rf aws awscliv2.zip

      - name: Run backup script
        run: |
          ./scripts/backup-registry-fly.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          HEALTHCHECK_URL: ${{ secrets.BACKUP_HEALTHCHECK_URL }}

      - name: Notify on backup failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🚨 Registry Backup Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 Registry Backup Failed"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "The daily registry backup failed. Manual intervention required."
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Backup verification job
  verify-backup:
    name: Verify Latest Backup
    runs-on: ubuntu-latest
    if: ${{ always() && (needs.backup.result == 'success' || inputs.verify_only) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install
          rm -rf aws awscliv2.zip

      - name: Run verification
        run: |
          ./scripts/backup-registry-fly.sh --verify
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify on verification failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "⚠️ Registry Backup Verification Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "⚠️ Registry Backup Verification Failed"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "The latest backup could not be verified. It may be corrupted or incomplete."
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # List backups
  list-backups:
    name: List Available Backups
    runs-on: ubuntu-latest
    if: ${{ inputs.list_backups }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install
          rm -rf aws awscliv2.zip

      - name: List backups
        run: |
          ./scripts/backup-registry-fly.sh --list
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Weekly full database backup (separate from registry-specific backups)
  weekly-full-backup:
    name: Weekly Full Database Backup
    runs-on: ubuntu-latest
    if: github.event.schedule && contains(fromJson('["0 3 * * 0"]'), github.event.schedule)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install
          rm -rf aws awscliv2.zip

      - name: Run full database backup
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          DATABASE_URL=$(fly secrets get DATABASE_URL --app functionfly-orchestrator 2>/dev/null | head -1)
          
          # Full database backup (all tables)
          pg_dump --no-owner --no-acl --clean --if-exists "$DATABASE_URL" | gzip > "full_backup_${TIMESTAMP}.sql.gz"
          
          # Upload to R2
          AWS_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}" \
          AWS_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
          aws s3 cp "full_backup_${TIMESTAMP}.sql.gz" \
            "s3://${{ secrets.R2_BUCKET }}/full_backups/full_backup_${TIMESTAMP}.sql.gz" \
            --endpoint-url="${{ secrets.R2_ENDPOINT }}"
          
          # Create checksum
          sha256sum "full_backup_${TIMESTAMP}.sql.gz" > "full_backup_${TIMESTAMP}.sql.gz.sha256"
          
          AWS_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}" \
          AWS_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
          aws s3 cp "full_backup_${TIMESTAMP}.sql.gz.sha256" \
            "s3://${{ secrets.R2_BUCKET }}/full_backups/full_backup_${TIMESTAMP}.sql.gz.sha256" \
            --endpoint-url="${{ secrets.R2_ENDPOINT }}"
          
          echo "Full backup completed: full_backup_${TIMESTAMP}.sql.gz"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify on full backup completion
        if: success()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "✅ Weekly Full Database Backup Complete",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ Weekly Full Database Backup Complete"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "The weekly full database backup has been completed successfully."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify on full backup failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🚨 Weekly Full Database Backup Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 Weekly Full Database Backup Failed"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "The weekly full database backup failed. Please investigate immediately."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
