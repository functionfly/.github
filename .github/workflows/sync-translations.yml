name: Sync Translations

on:
  # Run on push to main when locale files or translation script changes
  push:
    branches: [main]
    paths:
      - 'web/dashboard/src/locales/**'
      - 'web/site/src/locales/**'
      - 'scripts/sync-translations.ts'

  # Run weekly to catch drift
  schedule:
    - cron: '0 6 * * 1'

  # Manual trigger
  workflow_dispatch:
    inputs:
      backend:
        description: 'Translation backend'
        type: choice
        options:
          - mymemory
          - ollama
        default: mymemory

jobs:
  check:
    name: Check translation coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check for missing translations
        run: bun scripts/sync-translations.ts --check

  translate:
    name: Auto-translate missing keys
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Translate missing keys
        run: bun scripts/sync-translations.ts --write --backend=${{ github.event.inputs.backend || 'mymemory' }}

      - name: Commit and PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git checkout -b chore/auto-translate-$(date +%Y%m%d)
            git add -A
            git commit -m "chore(i18n): translate missing keys via MyMemory"
            git push origin HEAD
            gh pr create \
              --title "chore(i18n): auto-translate missing keys" \
              --body "Automated translation via MyMemory API (free). Review before merging." \
              --label "i18n,automated"
          else
            echo "No translation changes needed."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
