# Optional: one-way sync Infisical → Fly secrets (manual only).
# Required GitHub secrets: INFISICAL_TOKEN (read), FLY_API_TOKEN (deploy scope).
name: Sync Infisical to Fly secrets

on:
  workflow_dispatch:
    inputs:
      infisical_env:
        description: Infisical environment slug (e.g. prod, staging)
        required: true
        default: prod
      fly_app:
        description: Fly.io app name
        required: true
        default: functionfly-control
      stage_only:
        description: "If true, run fly secrets import --stage (no immediate rollout)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Infisical CLI
        run: npm install -g @infisical/cli

      - name: Install Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Sync secrets
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          INFISICAL_ENV: ${{ github.event.inputs.infisical_env }}
          FLY_APP: ${{ github.event.inputs.fly_app }}
          STAGE: ${{ github.event.inputs.stage_only == 'true' && '1' || '' }}
        run: |
          command -v infisical
          flyctl version
          ./scripts/sync-infisical-to-fly.sh
