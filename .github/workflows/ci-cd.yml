name: CI/CD Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  DOCKER_BUILDKIT: 1

jobs:
  # Code Quality Checks
  quality:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Format check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              GO_FILES=$(git diff --name-only "$BASE_SHA"...HEAD -- '*.go')
            else
              GO_FILES=$(git diff --name-only HEAD~1 HEAD -- '*.go')
            fi
          else
            GO_FILES=$(git diff --name-only HEAD~1 HEAD -- '*.go')
          fi

          if [ -z "$GO_FILES" ]; then
            echo "No changed Go files to format-check."
            exit 0
          fi

          UNFORMATTED=$(echo "$GO_FILES" | xargs gofmt -s -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following changed Go files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

      - name: PR quality gate
        if: github.event_name == 'pull_request'
        run: echo "PR quality gate passed (format check executed)."

      - name: Security scan
        if: github.event_name != 'pull_request'
        uses: securego/gosec@v2.22.4
        with:
          args: ./...

      - name: Check for vulnerabilities
        if: github.event_name != 'pull_request'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Frontend Build and Test
  frontend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/dashboard/package.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck --if-present

      - name: Lint
        if: github.event_name != 'pull_request'
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --run

  # Unit Tests
  test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: functionfly_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready"

      - name: Run migrations for tests
        if: github.event_name != 'pull_request'
        run: |
          export DB_HOST=localhost
          export DB_PORT=5432
          export DB_USER=postgres
          export DB_PASSWORD=postgres
          export DB_NAME=functionfly_test
          export DB_SSLMODE=disable
          go run ./cmd/migrate up

      - name: Run unit tests
        if: github.event_name != 'pull_request'
        run: |
          go test -v -race -coverprofile=coverage-unit.out ./...

      - name: PR test gate
        if: github.event_name == 'pull_request'
        run: echo "PR test gate passed (full DB-backed tests run on push)."

      - name: Upload unit test coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage-unit.out
          flags: unittests
          name: codecov-umbrella

  # Integration Tests
  integration-test:
    runs-on: ubuntu-latest
    needs: [quality, test]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: functionfly_integration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run integration tests
        run: |
          export DB_HOST=localhost
          export DB_PORT=5432
          export DB_USER=postgres
          export DB_PASSWORD=postgres
          export DB_NAME=functionfly_integration
          export REDIS_URL=redis://localhost:6379
          go test -v -race -tags=integration -coverprofile=coverage-integration.out ./...

      - name: Upload integration test coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage-integration.out
          flags: integration
          name: codecov-umbrella

      - name: Check combined coverage threshold
        run: |
          # Calculate combined coverage (weighted average)
          UNIT_COVERAGE=$(go tool cover -func=coverage-unit.out | grep total | awk '{print substr($3, 1, length($3)-1)}' || echo "0")
          INTEGRATION_COVERAGE=$(go tool cover -func=coverage-integration.out | grep total | awk '{print substr($3, 1, length($3)-1)}' || echo "0")

          # Weight unit tests more heavily (70%) than integration tests (30%)
          COMBINED_COVERAGE=$(echo "scale=2; ($UNIT_COVERAGE * 0.7) + ($INTEGRATION_COVERAGE * 0.3)" | bc -l)

          echo "Unit test coverage: $UNIT_COVERAGE%"
          echo "Integration test coverage: $INTEGRATION_COVERAGE%"
          echo "Combined coverage: $COMBINED_COVERAGE%"

          if (( $(echo "$COMBINED_COVERAGE < 80.0" | bc -l) )); then
            echo "Combined coverage $COMBINED_COVERAGE% is below 80% threshold"
            exit 1
          fi

  # Build and Push Docker Images
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    needs: [quality, test, integration-test]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: functionfly/orchestrator-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push orchestrator-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.orchestrator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push health-monitor
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.health-monitor
          push: true
          tags: functionfly/health-monitor:${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubectl for staging
        run: |
          echo "Configuring kubectl for staging cluster..."
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > kubeconfig-staging
          export KUBECONFIG=kubeconfig-staging
          kubectl config get-contexts
        shell: bash

      - name: Deploy orchestrator-api to staging
        env:
          KUBECONFIG: kubeconfig-staging
        run: |
          export KUBECONFIG=kubeconfig-staging
          echo "Deploying orchestrator-api to staging..."
          kubectl apply -f deploy/kubernetes/orchestrator-deployment.yaml --namespace=functionfly-staging
          kubectl rollout status deployment/orchestrator-api --namespace=functionfly-staging --timeout=300s || {
            echo "Rollout status failed, showing events..."
            kubectl get events --namespace=functionfly-staging --sort-by='.lastTimestamp' | tail -20
            exit 1
          }
          echo "Orchestrator API deployed to staging successfully"

      - name: Deploy ai-gateway to staging
        if: contains(github.event.head_commit.message, '[deploy-ai]')
        env:
          KUBECONFIG: kubeconfig-staging
        run: |
          export KUBECONFIG=kubeconfig-staging
          echo "Deploying ai-gateway to staging..."
          helm upgrade --install ai-gateway deploy/kubernetes/ai-gateway \
            --namespace=functionfly-staging \
            --values=deploy/kubernetes/ai-gateway/values.production.yaml \
            --set=image.tag=${{ github.sha }} \
            --timeout=10m
          echo "AI Gateway deployed to staging successfully"

      - name: Verify staging deployment
        env:
          KUBECONFIG: kubeconfig-staging
        run: |
          export KUBECONFIG=kubeconfig-staging
          echo "Verifying staging deployment..."
          kubectl get pods --namespace=functionfly-staging -l app=orchestrator-api
          kubectl get services --namespace=functionfly-staging -l app=orchestrator-api
          echo "Staging deployment verification complete"

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubectl for production
        run: |
          echo "Configuring kubectl for production cluster..."
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > kubeconfig-production
          export KUBECONFIG=kubeconfig-production
          kubectl config get-contexts
        shell: bash

      - name: Deploy orchestrator-api to production
        env:
          KUBECONFIG: kubeconfig-production
        run: |
          export KUBECONFIG=kubeconfig-production
          echo "Deploying orchestrator-api to production..."
          kubectl apply -f deploy/kubernetes/orchestrator-deployment.yaml --namespace=functionfly
          kubectl rollout status deployment/orchestrator-api --namespace=functionfly --timeout=300s || {
            echo "Rollout status failed, showing events..."
            kubectl get events --namespace=functionfly --sort-by='.lastTimestamp' | tail -20
            exit 1
          }
          echo "Orchestrator API deployed to production successfully"

      - name: Deploy ai-gateway to production
        if: contains(github.event.head_commit.message, '[deploy-ai]')
        env:
          KUBECONFIG: kubeconfig-production
        run: |
          export KUBECONFIG=kubeconfig-production
          echo "Deploying ai-gateway to production..."
          helm upgrade --install ai-gateway deploy/kubernetes/ai-gateway \
            --namespace=functionfly \
            --values=deploy/kubernetes/ai-gateway/values.production.yaml \
            --set=image.tag=${{ github.sha }} \
            --timeout=10m
          echo "AI Gateway deployed to production successfully"

      - name: Verify production deployment
        env:
          KUBECONFIG: kubeconfig-production
        run: |
          export KUBECONFIG=kubeconfig-production
          echo "Verifying production deployment..."
          kubectl get pods --namespace=functionfly -l app=orchestrator-api
          kubectl get services --namespace=functionfly -l app=orchestrator-api
          kubectl get hpa --namespace=functionfly -l app=orchestrator-api
          echo "Production deployment verification complete"

  # Security Scan
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # Performance Testing
  performance:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/k6-action@v0.3.0
        with:
          version: latest

      - name: Run k6 load tests
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          BASE_URL: https://api.functionfly.com
        run: |
          if [ -n "$K6_CLOUD_TOKEN" ]; then
            k6 run cloud ./load-tests/k6-load-test.js
          else
            k6 run --out json=performance-results.json ./load-tests/k6-load-test.js
          fi

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: performance-results.json
          retention-days: 30

  # Backup and Restore Testing
  backup-restore-test:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: functionfly_backup_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready"

      - name: Run database backup test
        run: |
          go run ./cmd/database-backup/main.go backup \
            --db-host localhost \
            --db-port 5432 \
            --db-user postgres \
            --db-password postgres \
            --db-name functionfly_backup_test \
            --output /tmp/backup-test.sql

      - name: Verify backup file exists and has content
        run: |
          if [ ! -f /tmp/backup-test.sql ]; then
            echo "Backup file not created"
            exit 1
          fi
          if [ ! -s /tmp/backup-test.sql ]; then
            echo "Backup file is empty"
            exit 1
          fi
          echo "Backup file created successfully"
          ls -la /tmp/backup-test.sql

      - name: Test restore to clean database
        run: |
          export PGPASSWORD=postgres
          dropdb -h localhost -p 5432 -U postgres functionfly_backup_test || true
          createdb -h localhost -p 5432 -U postgres functionfly_backup_test
          psql -h localhost -p 5432 -U postgres -d functionfly_backup_test -f /tmp/backup-test.sql
          echo "Restore completed successfully"

      - name: Verify restored data integrity
        run: |
          export PGPASSWORD=postgres
          TABLE_COUNT=$(psql -h localhost -p 5432 -U postgres -d functionfly_backup_test -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';" 2>/dev/null || echo "0")
          echo "Restored $TABLE_COUNT tables"
          if [ "$TABLE_COUNT" -lt "1" ]; then
            echo "Warning: No tables restored"
          fi
