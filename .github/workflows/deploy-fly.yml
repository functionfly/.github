name: Deploy to Fly.io Production

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/orchestrator-api/**'
      - 'internal/**'
      - 'deploy/production/**'
      - 'fly.toml'
      - 'scripts/deploy-fly-production.sh'
  workflow_dispatch:
    inputs:
      skip_staging:
        description: 'Skip staging deployment'
        type: boolean
        default: false
      force_deploy:
        description: 'Force deploy without confirmations'
        type: boolean
        default: false

env:
  GO_VERSION: '1.23'
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Build and test
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: |
          go test -v -short ./internal/... 2>&1 | head -100

      - name: Build orchestrator binary
        run: |
          CGO_ENABLED=1 go build \
            -ldflags="-X main.version=${{ github.sha }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o bin/orchestrator-api \
            ./cmd/orchestrator-api

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-binary
          path: bin/orchestrator-api
          retention-days: 1

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-fmt sarif -out gosec-results.sarif ./...'

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: gosec-results.sarif
          if-no-files-found: ignore

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: ${{ !inputs.skip_staging }}
    
    environment:
      name: staging
      url: https://functionfly-orchestrator-staging.fly.dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: orchestrator-binary
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/orchestrator-api

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to staging
        run: |
          fly deploy \
            --config fly.staging.toml \
            --app functionfly-orchestrator-staging \
            --yes \
            --wait-timeout=300s
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Run staging health checks
        run: |
          for i in {1..10}; do
            if curl -sf https://functionfly-orchestrator-staging.fly.dev/health; then
              echo "Staging health check passed!"
              exit 0
            fi
            echo "Attempt $i/10 - waiting for staging..."
            sleep 10
          done
          echo "Staging health check failed"
          exit 1

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: always() && (needs.deploy-staging.result == 'success' || inputs.skip_staging)
    
    environment:
      name: production
      url: https://functionfly-orchestrator.fly.dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: orchestrator-binary
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/orchestrator-api

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run production deployment
        run: |
          DEPLOY_FLAGS=""
          if [[ "${{ inputs.force_deploy }}" == "true" ]]; then
            DEPLOY_FLAGS="--yes"
          fi
          
          ./scripts/deploy-fly-production.sh \
            ${{ inputs.skip_staging && '--skip-staging' || '' }} \
            ${{ inputs.force_deploy && '--force' || '' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Post-deployment verification
        run: |
          sleep 30
          curl -sf https://functionfly-orchestrator.fly.dev/health || exit 1
          echo "Production deployment verified!"

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🚨 Production Deployment Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 Production Deployment Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify on success
        if: success()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "✅ Production Deployment Successful",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ Production Deployment Successful"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n`${{ github.sha }}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*App:* <https://functionfly-orchestrator.fly.dev|functionfly-orchestrator>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Smoke tests
  smoke-tests:
    name: Production Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-production
    
    steps:
      - name: Run smoke tests
        run: |
          BASE_URL="https://functionfly-orchestrator.fly.dev"
          
          # Health check
          echo "Testing health endpoint..."
          curl -sf "${BASE_URL}/health" || exit 1
          
          # Well-known endpoint
          echo "Testing well-known endpoint..."
          curl -sf "${BASE_URL}/.well-known/functionfly.json" || exit 1
          
          # API endpoints
          echo "Testing registry list..."
          curl -sf "${BASE_URL}/api/v1/registry/functions?limit=10" || exit 1
          
          echo "All smoke tests passed!"

      - name: Report smoke test failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "⚠️ Production Smoke Tests Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "⚠️ Production Smoke Tests Failed"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Deployment succeeded but smoke tests failed. Check the application immediately."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
