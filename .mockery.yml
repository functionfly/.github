all: false
dir: "{{.InterfaceDir}}"
filename: "mock_{{.InterfaceName}}.go"
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/functionfly/functionfly/internal/storage:
    interfaces:
      Repository: {}
  github.com/functionfly/functionfly/internal/adapters/functionfly:
    interfaces:
      EdgeDeploymentClientInterface: {}
  github.com/functionfly/functionfly/internal/api/handlers/registry/dre:
    interfaces:
      DRERepository: {}
      AnchorServicer: {}
