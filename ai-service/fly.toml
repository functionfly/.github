# Fly.io configuration for FlyMind AI Service
# Deploy with: fly deploy (from ai-service directory)

app = "functionfly-ai-service"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

# Public HTTP service for health checks and metrics scraping
[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-4x"
  memory = "1024mb"
  cpus = 2
  cpu_kind = "shared"

[env]
  PORT = "8081"
  HOST = "0.0.0.0"
  LOG_LEVEL = "info"
  SERVICE_NAME = "flymind-ai-service"
  SERVICE_VERSION = "1.0.0"

  # Production settings
  DEBUG = "false"
  ENABLE_STREAMING = "true"
  ENABLE_CACHING = "true"
  ENABLE_COST_TRACKING = "true"

  # Orchestrator integration (internal Fly.io DNS)
  ORCHESTRATOR_URL = "http://functionfly-api.internal:8080"

# Secrets to set via `fly secrets set`:
# - DATABASE_URL (or DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME, DB_SSLMODE)
# - REDIS_ADDR (and REDIS_PASSWORD if required)
# - OPENAI_API_KEY
# - ANTHROPIC_API_KEY
# - OPENROUTER_API_KEY (optional)
# - ORCHESTRATOR_API_KEY (for callbacks to orchestrator)
# - UPSTASH_REDIS_URL / UPSTASH_REDIS_TOKEN (if using Upstash)
# - ML_MODEL_ENCRYPTION_KEY (generate with: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")

# Health check configuration
[checks]
  [checks.health]
    port = 8081
    type = "http"
    interval = "30s"
    timeout = "10s"
    grace_period = "10s"
    method = "get"
    path = "/health"

# Auto-rollback on failed deployment
[experimental]
  auto_rollback = true
