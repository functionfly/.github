services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flymind-ai-service
    ports:
      - "8081:8081"
    environment:
      # API Keys - should be set via .env file or secrets manager
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}

      # Ollama (local development)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama2}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}

      # Default provider
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-openai}
      - DEFAULT_EMBEDDING_PROVIDER=${DEFAULT_EMBEDDING_PROVIDER:-openai}

      # Redis
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_CACHE_TTL=${REDIS_CACHE_TTL:-3600}

      # Database - use individual connection params for security
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_NAME:-functionfly}
      - DB_SSLMODE=${DB_SSLMODE:-require}

      # Feature flags
      - ENABLE_STREAMING=${ENABLE_STREAMING:-true}
      - ENABLE_CACHING=${ENABLE_CACHING:-true}
      - ENABLE_COST_TRACKING=${ENABLE_COST_TRACKING:-true}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-false}

      # Security settings
      - REQUIRE_REDIS=${REQUIRE_REDIS:-false}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro
      - /tmp:/tmp:ro  # Read-only tmp for security
    tmpfs:
      - /app/tmp:size=10M,mode=1777
    restart: unless-stopped
    read_only: true  # Read-only filesystem for security
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - flymind-internal
    user: "1000:1000"

  redis:
    image: redis:7-alpine
    container_name: flymind-redis
    ports:
      - "127.0.0.1:6379:6379"  # Bind to localhost only
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    read_only: true
    tmpfs:
      - /data:size=50M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - flymind-internal

networks:
  flymind-internal:
    driver: bridge
    internal: false  # Allow external for Redis, but restrict in production

volumes:
  redis-data:
    driver: local

