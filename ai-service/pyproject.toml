[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flymind-ai-service"
version = "1.0.0"
description = "FlyMind AI Service - Intelligent capabilities for FunctionFly"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "FunctionFly Team", email = "team@functionfly.com"}
]
keywords = ["ai", "llm", "openai", "anthropic", "ollama", "embeddings", "functionfly"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.42.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "redis>=7.3.0",
    "upstash-redis>=1.7.0",
    "httpx>=0.28.1",
    "openai>=2.30.0",
    "anthropic>=0.88.0",
    "python-dotenv>=1.2.2",
    "asyncpg>=0.31.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
    "mypy>=1.8.0",
    "pre-commit>=4.5.1",
]
moderation = [
    "detoxify>=0.5.2",
]
# Production-ready observability, resilience, and operations
observability = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "structlog>=24.4.0",
]
resilience = [
    "tenacity>=9.0.0",
]
errors = [
    "sentry-sdk[fastapi]>=2.0.0",
]
# Install with: pip install .[prod] or uv sync --extra prod
prod = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/api",
    "src/grpc",
    "src/integrations",
    "src/middleware",
    "src/models",
    "src/observability",
    "src/providers",
    "src/security",
    "src/services",
    "src/workers",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
