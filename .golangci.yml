version: "2"

# Custom linter rules for FunctionFly API
# Run with: golangci-lint run --config=.golangci.yml

linters:
  default: standard
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude: |
      # Allow blanket ignore of returns for functions that deliberately don't return errors
      # in handlers like fmt.Fprint, fmt.Fprintf (used for debugging/logging)
      ^fmt.Fprint*
      ^fmt.Fprintln*

  gosec:
    excludes:
      - G104  # Audit errors - not used in this project
      - G106   # Insecure configuration - used for intentional testing

  staticcheck:
    checks:
      - "all"
      - "-ST1000"  # Allow missing doc comments for implementation code
      - "-ST1003"  # Allow underscore variable names
      - "-ST1005"  # Allow starting with lowercase for exported after dot

# Custom rules for API error handling
custom:
  # Rule to detect direct http.Error usage instead of apierror.WriteError
  http-error-rule:
    type: "line"
    msg: "Use apierror.WriteError() instead of http.Error() for structured error responses"
    pattern: |
      http\.Error\(
    linter: "go vet"
    compiler: "inline"

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # Allow http.Error in test files
    - path: "_test\.go"
      linters:
        - "gosec"
      text: "http\\.Error"

    # Allow http.Error in middleware for rate limiting
    - path: "middleware/"
      linters:
        - "gosec"
      text: "http\\.Error"

    # Allow http.Error in non-API packages for debugging
    - path: "internal/debug"
      linters:
        - "gosec"
      text: "http\\.Error"
