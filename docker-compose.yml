version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: functionfly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator-api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.orchestrator
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=functionfly
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["go", "run", "./cmd/orchestrator-api"]

  # TODO: Add health-monitor service when ready

volumes:
  postgres_data: