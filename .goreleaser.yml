# .goreleaser.yml
# GoReleaser v2 configuration for FunctionFly CLI
# Cross-platform builds for Linux, macOS, and Windows

version: 2

project_name: fly

# Build configuration
builds:
  - id: fly
    dir: ./cmd/fly
    binary: fly
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/functionfly/functionfly/internal/version.Version={{ .Version }}
      - -X github.com/functionfly/functionfly/internal/version.Commit={{ .Commit }}
      - -X github.com/functionfly/functionfly/internal/version.Date={{ .Date }}
    env:
      - CGO_ENABLED=0

# Archive formats
archives:
  - id: default
    formats:
      - tar.gz
      - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true

# Linux package formats
nfpms:
  - id: linux-packages
    ids:
      - fly
    package_name: fly
    maintainer: FunctionFly <support@functionfly.com>
    homepage: https://functionfly.com
    description: FunctionFly CLI - Go from idea to global API in under 60 seconds
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk

# Checksums
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# GitHub release
release:
  draft: false
  prerelease: auto

# Snapshot configuration
snapshot:
  name_template: "{{ .Tag }}-next"

# Changelog
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
