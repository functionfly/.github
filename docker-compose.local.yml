# Local stack: everything in Docker except Postgres.
# Run Postgres on the host (e.g. port 5432). Containers reach it via host.docker.internal.
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d
#
# Ensure Postgres is running and migrated, e.g.:
#   DB_HOST=localhost DB_PORT=5432 ... go run ./cmd/orchestrator-api  # once to migrate
#   Or use your existing Postgres (Neon, local install, etc.)
#
# If the API container fails with "no pg_hba.conf entry for host 172.x.x.x", allow
# the Docker network in Postgres. Example (add to pg_hba.conf, then reload):
#   host  functionfly  postgres  172.18.0.0/16  scram-sha-256
#   (Use your actual Docker bridge subnet; check with: docker network inspect bridge)

services:
  redis:
    image: redis:8-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: [
      "redis-server",
      "--appendonly",
      "yes",
      "--maxmemory", "256mb",
      "--maxmemory-policy", "allkeys-lru"
    ]

  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      - CLAMD_CONF_FILE=/etc/clamav/clamd.conf

  yara:
    build:
      context: .
      dockerfile: deploy/yara/Dockerfile
    ports:
      - "8082:8080"
    volumes:
      - yara_data:/data
    environment:
      - YARA_RULES_PATH=/data/rules

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025/"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator-api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.orchestrator
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEVELOPMENT=true
      - INFISICAL_TOKEN=${INFISICAL_TOKEN}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-functionfly}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USERNAME=
      - SMTP_PASSWORD=
      - FROM_EMAIL=noreply@functionfly.dev
      - FROM_NAME=FunctionFly
      - BASE_URL=http://localhost:8080
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
      args:
        - CADDY_CONFIG=${CADDY_CONFIG:-local}
    ports:
      - "8083:8083"
    depends_on:
      - orchestrator-api
    volumes:
      - caddy_data:/data
    environment:
      - CADDYPATH=/data/caddy
      - CADDY_CONFIG=${CADDY_CONFIG:-local}

  health-monitor:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.health-monitor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - INFISICAL_TOKEN=${INFISICAL_TOKEN}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-functionfly}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USERNAME=
      - SMTP_PASSWORD=
      - FROM_EMAIL=noreply@functionfly.dev
      - FROM_NAME=FunctionFly
      - BASE_URL=http://localhost:8080
    depends_on:
      mailpit:
        condition: service_healthy

volumes:
  caddy_data:
  mailpit_data:
  redis_data:
  clamav_data:
  yara_data:
