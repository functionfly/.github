# Full local dev infrastructure in Docker.
# Brings up Postgres, Redis, NATS, Prometheus, and Mailpit as Docker services.
# The orchestrator-api and SAR binary are run on the host (go run / cargo run).
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#
# Then run the Go API on the host:
#   make dev
#   # or
#   ./bin/orchestrator-api --skip-migrations
#
# Start SAR separately (requires Rust toolchain):
#   make dev-sar &
#
# Note: SAR cannot be containerized here because it requires the Rust toolchain
# to build. Build the binary once with: make build-sar
# Then run it with: NATS_URL=nats://localhost:4222 ./bin/functionfly-sar
#
# Required env vars when using Docker Postgres (DB_PORT=5434):
#   DB_HOST=localhost DB_PORT=5434 ./bin/orchestrator-api --skip-migrations
#
# If the API container fails with "no pg_hba.conf entry for host 172.x.x.x", allow
# the Docker network in Postgres. Example (add to pg_hba.conf, then reload):
#   host  functionfly  postgres  172.18.0.0/16  scram-sha-256
#   (Use your actual Docker bridge subnet; check with: docker network inspect bridge)

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: functionfly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "shared_preload_libraries=vector"]

  redis:
    image: redis:8-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
    volumes:
      - nats_data:/data
    command:
      [
        "--",
        "-c",
        "/dev/null",
      ]

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
      - /etc/secrets:/etc/secrets:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    volumes:
      - mailpit_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8025/",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  nats_data:
  prometheus_data:
  mailpit_data:
