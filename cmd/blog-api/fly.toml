# Fly.io configuration for FunctionFly Blog API
# Deploy with: fly deploy (from cmd/blog-api directory)
# Or from root: fly deploy --config cmd/blog-api/fly.toml

app = "functionfly-blog-api"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "10s"
    method = "get"
    path = "/api/v1/blog/posts?page=1&limit=1"

[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"

[env]
  PORT = "3000"
  NODE_ENV = "production"

# Secrets to set via `fly secrets set`:
# - DATABASE_URL (PostgreSQL connection string, e.g., postgres://user:pass@host:5432/dbname)
# - JWT_SECRET (shared secret with Go orchestrator for token validation)
# - API_URL (optional, public URL of the blog API for callbacks/webhooks)
#
# Example:
#   fly secrets set DATABASE_URL="postgres://user:pass@host:5432/blogdb"
#   fly secrets set JWT_SECRET="your-shared-jwt-secret"

# Health check configuration
[checks]
  [checks.health]
    port = 3000
    type = "http"
    interval = "30s"
    timeout = "10s"
    grace_period = "10s"
    method = "get"
    path = "/api/v1/blog/posts?page=1&limit=1"

# Auto-rollback on failed deployment
[experimental]
  auto_rollback = true
