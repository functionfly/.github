<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="appBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
    <linearGradient id="appLightningGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="symbol3Tone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#e879f9"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners (180px radius scaled to 1024) -->
  <rect width="1024" height="1024" rx="230" fill="url(#appBgGradient)"/>
  
  <!-- Symbol centered and scaled -->
  <g transform="translate(352, 352) scale(16)">
    <!-- Hexagon Base -->
    <path d="M24 4 L42 14 L42 34 L24 44 L6 34 L6 14 Z" 
          fill="white" 
          opacity="0.2"/>
    <path d="M24 4 L42 14 L42 34 L24 44 L6 34 L6 14 Z" 
          fill="none" 
          stroke="white" 
          stroke-width="2"/>
    
    <!-- Wing Tips -->
    <path d="M24 8 L32 14 L24 14 L16 14 Z" 
          fill="white" 
          opacity="0.8"/>
    <path d="M12 26 L18 30 L15 34 L10 30 Z" 
          fill="white" 
          opacity="0.6"/>
    <path d="M36 26 L30 30 L33 34 L38 30 Z" 
          fill="white" 
          opacity="0.6"/>
    
    <!-- Lightning Bolt Core -->
    <path d="M26 12 L20 22 L24 22 L22 32 L30 20 L26 20 L28 12 Z" 
          fill="url(#appLightningGradient)"/>
    
    <!-- Flight Path Lines -->
    <path d="M24 16 L24 36" 
          stroke="white" 
          stroke-width="2" 
          stroke-linecap="round"/>
    <path d="M18 20 L24 24 L30 20" 
          fill="none" 
          stroke="white" 
          stroke-width="1.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Connection Dots -->
    <circle cx="24" cy="18" r="2" fill="#6366f1"/>
    <circle cx="18" cy="28" r="1.5" fill="#8b5cf6"/>
    <circle cx="30" cy="28" r="1.5" fill="#d946ef"/>
  </g>
</svg>
