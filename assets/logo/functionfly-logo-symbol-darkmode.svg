<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Brighter Gradient for Dark Mode -->
    <linearGradient id="darkSymbolGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="50%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#f0abfc"/>
    </linearGradient>
    <!-- Lightning for Dark Mode -->
    <linearGradient id="darkLightningGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  
  <!-- Symbol Group -->
  <g>
    <!-- Hexagon Base -->
    <path d="M24 4 L42 14 L42 34 L24 44 L6 34 L6 14 Z" 
          fill="url(#darkSymbolGradient)" 
          opacity="0.2"/>
    <path d="M24 4 L42 14 L42 34 L24 44 L6 34 L6 14 Z" 
          fill="none" 
          stroke="url(#darkSymbolGradient)" 
          stroke-width="2"/>
    
    <!-- Wing Tips -->
    <path d="M24 8 L32 14 L24 14 L16 14 Z" 
          fill="url(#darkSymbolGradient)" 
          opacity="0.9"/>
    <path d="M12 26 L18 30 L15 34 L10 30 Z" 
          fill="url(#darkSymbolGradient)" 
          opacity="0.7"/>
    <path d="M36 26 L30 30 L33 34 L38 30 Z" 
          fill="url(#darkSymbolGradient)" 
          opacity="0.7"/>
    
    <!-- Lightning Bolt Core -->
    <path d="M26 12 L20 22 L24 22 L22 32 L30 20 L26 20 L28 12 Z" 
          fill="url(#darkLightningGradient)"/>
    
    <!-- Flight Path Lines -->
    <path d="M24 16 L24 36" 
          stroke="url(#darkSymbolGradient)" 
          stroke-width="2" 
          stroke-linecap="round"/>
    <path d="M18 20 L24 24 L30 20" 
          fill="none" 
          stroke="url(#darkSymbolGradient)" 
          stroke-width="1.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Connection Dots -->
    <circle cx="24" cy="18" r="2" fill="#818cf8"/>
    <circle cx="18" cy="28" r="1.5" fill="#c084fc"/>
    <circle cx="30" cy="28" r="1.5" fill="#f0abfc"/>
  </g>
</svg>
