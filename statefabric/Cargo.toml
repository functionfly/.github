[package]
name = "statefabric"
version = "0.1.0"
edition = "2021"
description = "Deterministic state management for AI agents"

[dependencies]
# Web framework
axum = { version = "0.8.9", features = ["macros"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["trace", "cors"] }

# Async runtime
tokio = { version = "1.52.3", features = ["full"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Database
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "json", "chrono"] }

# Hashing (Blake3 for deterministic replay)
blake3 = "1.8.5"

# UUID
uuid = { version = "1.23.3", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4.45", features = ["serde"] }

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.102"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Object storage
aws-config = "1.8.18"
aws-sdk-s3 = "1.135.0"
aws-smithy-runtime = "1.11.3"

# Redis
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }

# Async trait support
async-trait = "0.1.89"

# Config
config = "0.15.23"

# HMAC for request signing
hmac = "0.13.0"

# WASM runtime
wasmtime = "45.0.1"
wasmtime-wasi = "45.0.1"
wasi-common = "45.0.1"

# WASM utilities
wasmparser = "0.251.0"

[dev-dependencies]
criterion = "0.8.2"
tokio-test = "0.4.5"
mockall = "0.14.0"

[lib]
name = "statefabric"
path = "src/lib.rs"

[[bin]]
name = "statefabric"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
